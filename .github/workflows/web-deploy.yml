# Build and deploy the jed website (/web) to GitHub Pages (CLAUDE.md §6/§10). The site is entirely
# static (SvelteKit adapter-static); this workflow gates on svelte-check and the interactive-feature
# Playwright suite (the contract for the live database / language switcher / OPFS tool), which builds
# with the project base path. The exact tested artifact is published. The website is a non-core tooling module,
# so this is separate from the engine's `mise run ci` gate.

name: Deploy website

# Deploy only when a GitHub Release is published (a deliberate, tagged release — NOT every push to
# master), plus a manual escape hatch. To deploy on a bare tag push instead, swap this for:
#   push:
#     tags: ['v*']
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: '/${{ github.event.repository.name }}'
      SITE_URL: 'https://${{ github.repository_owner }}.github.io'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.event.release.tag_name || github.ref }}'

      - uses: actions/setup-node@v4
        with:
          # Match the pinned development toolchain used by mise run ci.
          node-version: '26.10.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            impl/ts/package-lock.json

      - run: npm ci

      # The site bundles the TS core from ../impl/ts/src, which imports its one runtime dependency
      # (@noble/hashes) from impl/ts/node_modules.
      - run: npm ci --omit=dev
        working-directory: impl/ts

      - name: Type check
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Gate: the interactive-feature suite drives the BUILT static site (live DB, language switcher,
      # OPFS tool) in headless Chromium. A failure blocks the deploy.
      - name: Interactive-feature tests
        run: npm run test:browser

      # Publish the exact project-path build that passed the browser tests above.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
