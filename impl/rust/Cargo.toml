[package]
name = "jed"
version = "0.0.0"
edition = "2024"
publish = false
description = "Rust core of the engine — a downstream consumer of /spec (CLAUDE.md §2)."
# The integration tests reach into internal modules, which are now private (API-narrowing). They are
# compiled IN-CRATE instead (src/integration_tests.rs #[path]-includes each tests/*.rs as a #[cfg(test)]
# module, with `extern crate self as jed` keeping their `jed::…` paths working), so auto-discovery is off.
autotests = false

[lib]
name = "jed"
path = "src/lib.rs"

# The conformance harness: runs the shared corpus under spec/conformance.
[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

# The deterministic-simulation runner (spec/design/simulation-testing.md §11): test-only, so behind a
# non-default feature that adds no dependency. Built and run by scripts/sim.rb.
[[bin]]
name = "sim"
path = "src/bin/sim.rs"
required-features = ["sim"]

[features]
sim = []

[dependencies]
# OS entropy for the uuid generators' production path (spec/design/entropy.md §6). Rust `std`
# has no OS RNG; the engine reads one u64 seed per statement only when a generator runs unseeded
# (tests inject a fixed seed and never touch this). Approved under CLAUDE.md §14 (the user's
# "engine reads OS entropy" decision); Go/TS use their stdlib (crypto/rand, node:crypto).
getrandom = "0.3"
# The digest functions md5 / sha224 / sha256 / sha384 / sha512 (spec/design/string-functions.md §4).
# Approved under CLAUDE.md §14 clause 3 (no hand-rolled crypto): RustCrypto's vetted implementations.
# Both are standardized, so the output matches Go's stdlib and TS's @noble/hashes byte-for-byte.
md-5 = "=0.11.0"
sha2 = "=0.11.0"

[dev-dependencies]
# TOML is a TEST-TIME ONLY dependency (CLAUDE.md §5): the cross-check tests read the
# canonical spec data tables to prove the hand-written constants match. No runtime use.
toml = "0.9"

# Release codegen with debug assertions and integer-overflow checks ON: the corpus walk's checked
# pass (`mise run conformance:rust:checked`). Release-sized frames keep resource/depth_limit.test's
# deep nesting within the default main-thread stack, which a debug build overflows.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
