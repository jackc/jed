schema_version = 1
name = "compaction-presence-and-continuity"
description = "Compaction refuses while a page client or a local reader pins a snapshot, then rewrites the file; a connected client continues on the compacted image and a later process opens it (api.md §2.6; spec/pageservice/README.md §6.2)."
requires = ["file.page_service"]
byte_identical = true

[[step]]
actor = "a"
command = "start"
argument = "create"

[[step]]
actor = "a"
command = "exec"
sql = "CREATE TABLE t (id i64 PRIMARY KEY, pad text)"

[[step]]
actor = "a"
command = "exec"
sql = "INSERT INTO t SELECT g, repeat('x', 300) FROM generate_series(1, 2000) g"

[[step]]
actor = "a"
command = "exec"
sql = "DELETE FROM t WHERE id > 100"

[[step]]
actor = "b"
command = "start"
argument = "open"

# Another process has the file open: compaction needs presence EX and never waits.
[[step]]
actor = "b"
command = "read_open"

[[step]]
actor = "b"
command = "read_query_i64"
sql = "SELECT count(*) FROM t"
expect = "100"

[[step]]
actor = "a"
command = "compact"
expect_error = "55006"

[[step]]
actor = "b"
command = "read_close"

[[step]]
actor = "a"
command = "read_open"

[[step]]
actor = "a"
command = "compact"
expect_error = "55006"

[[step]]
actor = "a"
command = "read_close"

# The client's end_read reaches the owner asynchronously.
[[step]]
actor = "a"
command = "compact"
retry_ms = 2000

[[step]]
actor = "a"
command = "page_count"
expect = "9"

[[step]]
actor = "a"
command = "txid"
expect = "5"

# A new process joins through the unchanged lock bundle and sees the compacted file.
[[step]]
actor = "b"
command = "query_i64"
sql = "SELECT count(*) FROM t"
expect = "100"

[[step]]
actor = "b"
command = "exec"
sql = "INSERT INTO t VALUES (5000, 'tail')"

[[step]]
actor = "a"
command = "query_i64"
sql = "SELECT count(*), max(id) FROM t"
expect = "101:5000"

[[step]]
actor = "b"
command = "close"

[[step]]
actor = "a"
command = "close"
