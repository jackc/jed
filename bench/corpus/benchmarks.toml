# Benchmark definitions — one entry per benchmark, shared by every harness binary.
# spec/design/benchmarks.md §3. SQL uses $N placeholders (SQLite harnesses rewrite to ?N);
# multi-row queries MUST carry a total-order ORDER BY (explicit id tie-break) so the
# cross-engine answer checksum is deterministic.

schema_version = 1

[[bench]]
name = "point_lookup_pk_ramp"
description = "PK point lookup on 1M rows with a short warmup; includes jed leaf-cache population"
dataset = "large"
kind = "query"
sql = "SELECT id, customer_id, amount, note FROM orders WHERE id = $1"
warmup = 2000
iterations = 50000
seed = 4201
expect_rows_per_iter = 1

[[bench.param]]
gen = "int_uniform"
min = 1
max = 1000000

[[bench]]
name = "point_lookup_pk"
description = "Fully-hot PK point lookup on 1M rows after warming the leaf working set"
dataset = "large"
kind = "query"
sql = "SELECT id, customer_id, amount, note FROM orders WHERE id = $1"
warmup = 50000
iterations = 50000
seed = 4201
expect_rows_per_iter = 1

[[bench.param]]
gen = "int_uniform"
min = 1
max = 1000000

# Composite-PK complete tuple lookup (query.composite_pk_pushdown). The scratch setup builds 100
# contiguous 1000-row bucket prefixes; fixing bucket=42 and probing id exercises direct tuple-key
# encoding. Before the tuple-bound slice jed full-scanned all 100k rows per iteration.
[[bench]]
name = "composite_pk_lookup"
description = "Composite-PK exact tuple lookup on 100k rows; direct concatenated-key seek"
dataset = "scratch"
kind = "query"
sql = "SELECT v FROM composite_orders WHERE bucket = 42 AND id = $1"
warmup = 500
iterations = 20000
seed = 4253
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS composite_orders",
  "CREATE TABLE composite_orders (bucket bigint, id bigint, v bigint, PRIMARY KEY (bucket, id))",
  "INSERT INTO composite_orders SELECT (g - 1) / 1000, g, g * 2 FROM generate_series(1, 100000) AS g"
]

[[bench.param]]
gen = "int_uniform"
min = 42001
max = 43000

# Canonical range-union intervals (query.interval_set). Two disjoint, parameterized PK windows each
# admit roughly 9–17 rows from a 100k-row scratch table. Before interval-set lowering this OR shape
# full-scanned every row; runtime encoding now sorts/canonicalizes the two windows and scans them once.
[[bench]]
name = "interval_set_pk"
description = "Two disjoint parameterized PK ranges on 100k rows; canonical interval scans vs. a full scan"
dataset = "scratch"
kind = "query"
sql = "SELECT id, v FROM interval_orders WHERE id BETWEEN $1 AND $2 OR id BETWEEN $3 AND $4 ORDER BY id"
warmup = 500
iterations = 15000
seed = 4254
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS interval_orders",
  "CREATE TABLE interval_orders (id bigint PRIMARY KEY, v bigint)",
  "INSERT INTO interval_orders SELECT g, g * 2 FROM generate_series(1, 100000) AS g"
]

[[bench.param]]
gen = "int_uniform"
min = 100
max = 49000

[[bench.param]]
gen = "int_window"
base = 0
off_min = 8
off_max = 16

[[bench.param]]
gen = "int_uniform"
min = 51000
max = 99900

[[bench.param]]
gen = "int_window"
base = 2
off_min = 8
off_max = 16

# Bounded LIMIT streaming over an ordered secondary-index range
# (query.bounded_limit_streaming). The range admits 65–129 rows, but ORDER BY the same index lets
# each core stop its index walk and table point-lookups after five rows. Before this slice the bound
# was gathered eagerly, so every admitted row was fetched before LIMIT discarded all but five.
[[bench]]
name = "bounded_index_limit"
description = "Secondary-index range on 100k rows with a compatible ORDER BY and LIMIT 5; stop after five table lookups"
dataset = "scratch"
kind = "query"
sql = "SELECT id, x FROM bounded_orders WHERE x BETWEEN $1 AND $2 ORDER BY x LIMIT 5"
warmup = 500
iterations = 15000
seed = 4255
expect_rows_per_iter = 5
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS bounded_orders",
  "CREATE TABLE bounded_orders (id bigint PRIMARY KEY, x bigint, v bigint)",
  "INSERT INTO bounded_orders SELECT g, g, g * 2 FROM generate_series(1, 100000) AS g",
  "CREATE INDEX bounded_orders_x_idx ON bounded_orders (x)"
]

[[bench.param]]
gen = "int_uniform"
min = 100
max = 99800

[[bench.param]]
gen = "int_window"
base = 0
off_min = 64
off_max = 128

# P6b order-only candidate: no WHERE bound supplies the order, so the planner compares a full scan
# plus unmetered blocking sort with a secondary-index walk whose LIMIT stops after five lookups.
[[bench]]
name = "order_only_index_limit"
description = "Order-only secondary-index walk on 100k reverse-PK rows with LIMIT 5"
dataset = "scratch"
kind = "query"
sql = "SELECT id, x FROM p6b_ordered ORDER BY x LIMIT 5"
warmup = 500
iterations = 15000
seed = 4261
expect_rows_per_iter = 5
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS p6b_ordered",
  "CREATE TABLE p6b_ordered (id bigint PRIMARY KEY, x bigint)",
  "INSERT INTO p6b_ordered SELECT g, 100001 - g FROM generate_series(1, 100000) AS g",
  "CREATE INDEX p6b_ordered_x_idx ON p6b_ordered (x)"
]

# P6b makes GiST a cost-selected single-relation candidate. Ten ranges contain the fixed one-point
# query range; the complete path competes with the 50k-row full scan.
[[bench]]
name = "gist_range_select"
description = "Cost-selected GiST range containment over 50k rows with ten matches"
dataset = "scratch"
kind = "query"
sql = "SELECT id FROM p6b_ranges WHERE span @> int4range(25000, 25001) ORDER BY id"
warmup = 200
iterations = 5000
seed = 4262
expect_rows_per_iter = 10
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS p6b_ranges",
  "CREATE TABLE p6b_ranges (id bigint PRIMARY KEY, span int4range)",
  "INSERT INTO p6b_ranges (id) SELECT g FROM generate_series(1, 50000) AS g",
  "UPDATE p6b_ranges SET span = int4range(CAST(id AS integer), CAST(id + 10 AS integer))",
  "CREATE INDEX p6b_ranges_span_gist ON p6b_ranges USING gist (span)"
]

# Join top-N combined with index-nested-loop (query.order_by_join_inl). The outer-PK order needs no
# sort and LIMIT 10 stops after ten per-outer inner PK seeks. Before the combination, INL still
# opened all 10k inner bounds and the blocking path sorted the complete 1:1 join before slicing.
[[bench]]
name = "join_inl_topn"
description = "Outer-PK ORDER BY LIMIT 10 over a 10k×100k 1:1 join; stop after ten inner PK seeks"
dataset = "scratch"
kind = "query"
sql = "SELECT o.id, i.v FROM join_outer o JOIN join_inner i ON i.id = o.k ORDER BY o.id LIMIT 10"
warmup = 50
iterations = 1000
seed = 4256
expect_rows_per_iter = 10
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS join_inner",
  "DROP TABLE IF EXISTS join_outer",
  "CREATE TABLE join_outer (id bigint PRIMARY KEY, k bigint)",
  "CREATE TABLE join_inner (id bigint PRIMARY KEY, v bigint)",
  "INSERT INTO join_outer SELECT g, g FROM generate_series(1, 10000) AS g",
  "INSERT INTO join_inner SELECT g, g * 2 FROM generate_series(1, 100000) AS g"
]

# Deterministic in-memory hash join (query.hash_join) and its expression-key nested-loop reference.
# Both produce 12,500 matches from the same 2,500×2,500 logical inputs. The bare same-type column
# equality selects hash join; wrapping the left key in +0 deliberately defeats the rule.
[[bench]]
name = "hash_join_equijoin"
description = "In-memory hash equijoin: build/probe 2,500-row inputs instead of 6.25M nested-loop candidates"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM hash_left l JOIN hash_right r ON l.k = r.k"
warmup = 2
iterations = 10
seed = 4257
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS hash_right",
  "DROP TABLE IF EXISTS hash_left",
  "CREATE TABLE hash_left (id bigint PRIMARY KEY, k bigint)",
  "CREATE TABLE hash_right (id bigint PRIMARY KEY, k bigint)",
  "INSERT INTO hash_left SELECT g, g % 500 FROM generate_series(1, 2500) AS g",
  "INSERT INTO hash_right SELECT g, g % 500 FROM generate_series(1, 2500) AS g"
]

[[bench]]
name = "hash_join_nested_fallback"
description = "Expression-key nested-loop reference for hash_join_equijoin; identical 12,500-row join result"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM hash_ref_left l JOIN hash_ref_right r ON l.k + 0 = r.k"
warmup = 2
iterations = 10
seed = 4258
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS hash_ref_right",
  "DROP TABLE IF EXISTS hash_ref_left",
  "CREATE TABLE hash_ref_left (id bigint PRIMARY KEY, k bigint)",
  "CREATE TABLE hash_ref_right (id bigint PRIMARY KEY, k bigint)",
  "INSERT INTO hash_ref_left SELECT g, g % 500 FROM generate_series(1, 2500) AS g",
  "INSERT INTO hash_ref_right SELECT g, g % 500 FROM generate_series(1, 2500) AS g"
]

# Stage-2 WHERE pushdown (query.where_pushdown) and its results-identical residual reference. Each
# 4,000-row input keeps 2% of its rows (flag = 1). The expression ON key keeps nested loop in both
# forms, so the pushed form runs ON over 80 × 80 = 6,400 pairs while the `+ 0` reference — whose
# arithmetic conjuncts never move — runs ON over all 16M pairs before filtering.
[[bench]]
name = "where_pushdown_join"
description = "Single-table WHERE conjuncts run inside each scan: 80×80 nested-loop pairs instead of 4,000×4,000"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM pd_left l JOIN pd_right r ON l.k + 0 = r.k WHERE l.flag = 1 AND r.flag = 1"
warmup = 2
iterations = 20
seed = 4271
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS pd_right",
  "DROP TABLE IF EXISTS pd_left",
  "CREATE TABLE pd_left (id bigint PRIMARY KEY, k bigint, flag bigint)",
  "CREATE TABLE pd_right (id bigint PRIMARY KEY, k bigint, flag bigint)",
  "INSERT INTO pd_left SELECT g, g % 400, CASE WHEN g % 50 = 0 THEN 1 ELSE 0 END FROM generate_series(1, 4000) AS g",
  "INSERT INTO pd_right SELECT g, g % 400, CASE WHEN g % 50 = 0 THEN 1 ELSE 0 END FROM generate_series(1, 4000) AS g"
]

[[bench]]
name = "where_pushdown_join_residual"
description = "Residual reference for where_pushdown_join: `+ 0` conjuncts stay above the 16M-pair nested loop"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM pd_ref_left l JOIN pd_ref_right r ON l.k + 0 = r.k WHERE l.flag + 0 = 1 AND r.flag + 0 = 1"
warmup = 1
iterations = 3
seed = 4272
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS pd_ref_right",
  "DROP TABLE IF EXISTS pd_ref_left",
  "CREATE TABLE pd_ref_left (id bigint PRIMARY KEY, k bigint, flag bigint)",
  "CREATE TABLE pd_ref_right (id bigint PRIMARY KEY, k bigint, flag bigint)",
  "INSERT INTO pd_ref_left SELECT g, g % 400, CASE WHEN g % 50 = 0 THEN 1 ELSE 0 END FROM generate_series(1, 4000) AS g",
  "INSERT INTO pd_ref_right SELECT g, g % 400, CASE WHEN g % 50 = 0 THEN 1 ELSE 0 END FROM generate_series(1, 4000) AS g"
]

# Stage-2 WHERE contradiction (query.where_contradiction): the empty literal range is proven at plan
# time, so jed reads none of the 100k rows; PostgreSQL scans them.
[[bench]]
name = "where_contradiction"
description = "Provably empty `v > 100 AND v < 50` over 100k rows: no relation is read"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM contradiction_orders WHERE v > 100 AND v < 50"
warmup = 100
iterations = 5000
seed = 4273
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS contradiction_orders",
  "CREATE TABLE contradiction_orders (id bigint PRIMARY KEY, v bigint)",
  "INSERT INTO contradiction_orders SELECT g, g % 1000 FROM generate_series(1, 100000) AS g"
]

# Stage-2 pushdown into a derived body (query.derived_pushdown) and its results-identical outer-filter
# reference. Moved into the body, `d.id = 50000` seeks the PK of the 100k-row table; spelled
# `d.id + 0`, the conjunct stays outside and the whole body runs.
[[bench]]
name = "derived_pushdown_pk"
description = "A derived table's bare-column conjunct moves into its body and seeks the PK of 100k rows"
dataset = "scratch"
kind = "query"
sql = "SELECT d.id, d.v FROM (SELECT id, v FROM dp_orders) d WHERE d.id = 50000"
warmup = 100
iterations = 5000
seed = 4274
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS dp_orders",
  "CREATE TABLE dp_orders (id bigint PRIMARY KEY, v bigint)",
  "INSERT INTO dp_orders SELECT g, g % 1000 FROM generate_series(1, 100000) AS g"
]

[[bench]]
name = "derived_pushdown_pk_residual"
description = "Residual reference for derived_pushdown_pk: `d.id + 0 = 50000` runs the whole 100k-row body"
dataset = "scratch"
kind = "query"
sql = "SELECT d.id, d.v FROM (SELECT id, v FROM dp_ref_orders) d WHERE d.id + 0 = 50000"
warmup = 2
iterations = 20
seed = 4275
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS dp_ref_orders",
  "CREATE TABLE dp_ref_orders (id bigint PRIMARY KEY, v bigint)",
  "INSERT INTO dp_ref_orders SELECT g, g % 1000 FROM generate_series(1, 100000) AS g"
]

# Stage-2 pushdown below a grouped body's grouping (query.derived_pushdown) and its results-identical
# outer-filter reference. Moved into the body, `d.g = 500` bounds the (g, id) primary-key prefix, so
# one 100-row group is read and aggregated; spelled `d.g + 0`, all 100k rows are grouped into 1,000
# groups before the outer filter keeps one.
[[bench]]
name = "grouped_pushdown_pk"
description = "A grouping-column conjunct moves below a grouped body and seeks one 100-row group of 100k rows"
dataset = "scratch"
kind = "query"
sql = "SELECT d.g, d.n, d.m FROM (SELECT g, count(*) AS n, max(v) AS m FROM gp_orders GROUP BY g) d WHERE d.g = 500"
warmup = 100
iterations = 2000
seed = 4278
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS gp_orders",
  "CREATE TABLE gp_orders (g bigint, id bigint, v bigint, PRIMARY KEY (g, id))",
  "INSERT INTO gp_orders SELECT g % 1000, g, g % 97 FROM generate_series(1, 100000) AS g"
]

[[bench]]
name = "grouped_pushdown_pk_residual"
description = "Residual reference for grouped_pushdown_pk: `d.g + 0 = 500` groups all 100k rows first"
dataset = "scratch"
kind = "query"
sql = "SELECT d.g, d.n, d.m FROM (SELECT g, count(*) AS n, max(v) AS m FROM gp_ref_orders GROUP BY g) d WHERE d.g + 0 = 500"
warmup = 2
iterations = 20
seed = 4279
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS gp_ref_orders",
  "CREATE TABLE gp_ref_orders (g bigint, id bigint, v bigint, PRIMARY KEY (g, id))",
  "INSERT INTO gp_ref_orders SELECT g % 1000, g, g % 97 FROM generate_series(1, 100000) AS g"
]

# Stage-2 pushdown into every arm of a set operation (query.derived_pushdown) and its results-identical
# outer-filter reference. Moved into both UNION ALL arms, `s.id = 50000` seeks each 100k-row table's
# primary key; spelled `s.id + 0`, both arms run whole and 200k combined rows are filtered.
[[bench]]
name = "setop_pushdown_pk"
description = "A set-operation conjunct moves into both UNION ALL arms and seeks each 100k-row table's PK"
dataset = "scratch"
kind = "query"
sql = "SELECT s.id, s.v FROM (SELECT id, v FROM so_a UNION ALL SELECT id, v FROM so_b) s WHERE s.id = 50000 ORDER BY s.v"
warmup = 100
iterations = 5000
seed = 4280
expect_rows_per_iter = 2
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS so_a",
  "DROP TABLE IF EXISTS so_b",
  "CREATE TABLE so_a (id bigint PRIMARY KEY, v bigint)",
  "CREATE TABLE so_b (id bigint PRIMARY KEY, v bigint)",
  "INSERT INTO so_a SELECT g, g % 1000 FROM generate_series(1, 100000) AS g",
  "INSERT INTO so_b SELECT g, g % 997 FROM generate_series(1, 100000) AS g"
]

[[bench]]
name = "setop_pushdown_pk_residual"
description = "Residual reference for setop_pushdown_pk: `s.id + 0 = 50000` runs both 100k-row arms whole"
dataset = "scratch"
kind = "query"
sql = "SELECT s.id, s.v FROM (SELECT id, v FROM so_ref_a UNION ALL SELECT id, v FROM so_ref_b) s WHERE s.id + 0 = 50000 ORDER BY s.v"
warmup = 2
iterations = 20
seed = 4281
expect_rows_per_iter = 2
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS so_ref_a",
  "DROP TABLE IF EXISTS so_ref_b",
  "CREATE TABLE so_ref_a (id bigint PRIMARY KEY, v bigint)",
  "CREATE TABLE so_ref_b (id bigint PRIMARY KEY, v bigint)",
  "INSERT INTO so_ref_a SELECT g, g % 1000 FROM generate_series(1, 100000) AS g",
  "INSERT INTO so_ref_b SELECT g, g % 997 FROM generate_series(1, 100000) AS g"
]

# Stage-2 ON pushdown (query.on_pushdown) and its results-identical ON-resident reference. The pushed
# `r.flag = 1` filters each 4,000-row input's inner side to 2% before an expression-keyed nested loop;
# spelled `r.flag + 0 = 1` it stays in the ON and is evaluated over all 16M pairs.
[[bench]]
name = "on_pushdown_join"
description = "A single-side ON conjunct runs inside the inner scan: 4,000×80 nested-loop pairs instead of 4,000×4,000"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM op_left l JOIN op_right r ON l.k + 0 = r.k AND r.flag = 1"
warmup = 2
iterations = 20
seed = 4276
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS op_right",
  "DROP TABLE IF EXISTS op_left",
  "CREATE TABLE op_left (id bigint PRIMARY KEY, k bigint)",
  "CREATE TABLE op_right (id bigint PRIMARY KEY, k bigint, flag bigint)",
  "INSERT INTO op_left SELECT g, g % 400 FROM generate_series(1, 4000) AS g",
  "INSERT INTO op_right SELECT g, g % 400, CASE WHEN g % 50 = 0 THEN 1 ELSE 0 END FROM generate_series(1, 4000) AS g"
]

[[bench]]
name = "on_pushdown_join_residual"
description = "Residual reference for on_pushdown_join: `r.flag + 0 = 1` stays in the ON over 16M pairs"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM op_ref_left l JOIN op_ref_right r ON l.k + 0 = r.k AND r.flag + 0 = 1"
warmup = 1
iterations = 3
seed = 4277
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS op_ref_right",
  "DROP TABLE IF EXISTS op_ref_left",
  "CREATE TABLE op_ref_left (id bigint PRIMARY KEY, k bigint)",
  "CREATE TABLE op_ref_right (id bigint PRIMARY KEY, k bigint, flag bigint)",
  "INSERT INTO op_ref_left SELECT g, g % 400 FROM generate_series(1, 4000) AS g",
  "INSERT INTO op_ref_right SELECT g, g % 400, CASE WHEN g % 50 = 0 THEN 1 ELSE 0 END FROM generate_series(1, 4000) AS g"
]

# P7 reverse-orientation INL and its results-identical nested-loop reference. The indexed 50k-row
# relation deliberately appears first in SQL. Costed two-relation search reverses the physical
# order so the 250-row driver is left and the PK relation becomes the per-row bound inner; wrapping
# the PK expression in +0 keeps the same equality result while making the INL bound ineligible.
[[bench]]
name = "join_reverse_inl"
description = "P7 reverse physical order: 250 PK probes although the indexed 50k-row relation appears first"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM p7_reverse_inner i JOIN p7_reverse_driver d ON i.id = d.k"
warmup = 2
iterations = 10
seed = 4263
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS p7_reverse_driver",
  "DROP TABLE IF EXISTS p7_reverse_inner",
  "CREATE TABLE p7_reverse_inner (id bigint PRIMARY KEY, v bigint)",
  "CREATE TABLE p7_reverse_driver (id bigint PRIMARY KEY, k bigint)",
  "INSERT INTO p7_reverse_inner SELECT g, g * 2 FROM generate_series(1, 50000) AS g",
  "INSERT INTO p7_reverse_driver SELECT g, g * 199 FROM generate_series(1, 250) AS g"
]

[[bench]]
name = "join_reverse_nested_fallback"
description = "Expression-key nested-loop reference for join_reverse_inl; identical 250-row join result"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM p7_reverse_ref_inner i JOIN p7_reverse_ref_driver d ON i.id + 0 = d.k"
warmup = 2
iterations = 10
seed = 4264
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS p7_reverse_ref_driver",
  "DROP TABLE IF EXISTS p7_reverse_ref_inner",
  "CREATE TABLE p7_reverse_ref_inner (id bigint PRIMARY KEY, v bigint)",
  "CREATE TABLE p7_reverse_ref_driver (id bigint PRIMARY KEY, k bigint)",
  "INSERT INTO p7_reverse_ref_inner SELECT g, g * 2 FROM generate_series(1, 50000) AS g",
  "INSERT INTO p7_reverse_ref_driver SELECT g, g * 199 FROM generate_series(1, 250) AS g"
]

# P8 three-relation DP: the large indexed relation is authored first, but the complete N-way
# winner can drive from the small relation and retain legal PK/secondary join dependencies.
[[bench]]
name = "join_nway_inl_3"
description = "P8 three-way join search: drive 100 rows into indexed 20k-row and 20-row relations"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM p8_j3_inner i JOIN p8_j3_driver d ON i.id = d.k JOIN p8_j3_tag t ON t.id = d.tag"
warmup = 2
iterations = 20
seed = 4265
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS p8_j3_tag",
  "DROP TABLE IF EXISTS p8_j3_driver",
  "DROP TABLE IF EXISTS p8_j3_inner",
  "CREATE TABLE p8_j3_inner (id bigint PRIMARY KEY, v bigint)",
  "CREATE TABLE p8_j3_driver (id bigint PRIMARY KEY, k bigint, tag bigint)",
  "CREATE TABLE p8_j3_tag (id bigint PRIMARY KEY, v bigint)",
  "INSERT INTO p8_j3_inner SELECT g, g * 2 FROM generate_series(1, 20000) AS g",
  "INSERT INTO p8_j3_driver SELECT g, g * 199, (g % 20) + 1 FROM generate_series(1, 100) AS g",
  "INSERT INTO p8_j3_tag SELECT g, g * 3 FROM generate_series(1, 20) AS g"
]

# Five relations remain inside exhaustive DP. Source order starts with four 20k-row relations;
# the 100-row driver authored last supplies a legal reverse chain of PK INL dependencies.
[[bench]]
name = "join_nway_inl_5"
description = "P8 five-way DP: reverse a source-authored 20k-row PK chain from a 100-row driver"
dataset = "scratch"
kind = "query"
sql = "SELECT count(*) FROM p8_j5_r1 a JOIN p8_j5_r2 b ON a.id = b.id JOIN p8_j5_r3 c ON b.id = c.id JOIN p8_j5_r4 d ON c.id = d.id JOIN p8_j5_driver e ON d.id = e.k"
warmup = 1
iterations = 10
seed = 4266
expect_rows_per_iter = 1
engines = ["jed", "postgres"]
setup_sql = [
  "DROP TABLE IF EXISTS p8_j5_driver",
  "DROP TABLE IF EXISTS p8_j5_r4",
  "DROP TABLE IF EXISTS p8_j5_r3",
  "DROP TABLE IF EXISTS p8_j5_r2",
  "DROP TABLE IF EXISTS p8_j5_r1",
  "CREATE TABLE p8_j5_r1 (id bigint PRIMARY KEY)",
  "CREATE TABLE p8_j5_r2 (id bigint PRIMARY KEY)",
  "CREATE TABLE p8_j5_r3 (id bigint PRIMARY KEY)",
  "CREATE TABLE p8_j5_r4 (id bigint PRIMARY KEY)",
