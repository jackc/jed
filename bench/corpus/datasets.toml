# Benchmark dataset spec — consumed by bench-setup (generation) and every harness
# (fingerprint check). spec/design/benchmarks.md §4/§5. The sha256 of THIS FILE's bytes is
# the staleness fingerprint: any edit (including generator_version) invalidates the
# generated databases and harnesses refuse to run until `mise run bench:setup` regenerates.

schema_version = 1

# Bump whenever bench-setup's generation BEHAVIOR changes (row order, PRNG use, DDL
# derivation — or an engine change that reshapes the produced files, like the format.md
# split-rule fix) even if the shapes below do not.
# 4: the on-disk format bumped 21 → 22 (varchar(n) length limits), which reshapes every
#    generated .jed; the v21 datasets are unreadable by the current core, so invalidate them.
# 6: the on-disk format bumped 33 → 34 (the live page count in the meta page), so datasets
#    generated before it fail to open (XX001); invalidate them.
# 7: the on-disk format bumped 42 → 43 (timestamp / interval typmod slots), so v42 datasets
#    fail to open; invalidate them.
# 8: the on-disk format bumped 43 → 44 (composite column DEFAULTs), so v43 datasets fail to
#    open; invalidate them.
# 9: the on-disk format bumped 44 → 45 (partial and btree EXCLUDE constraints), so v44 datasets
#    fail to open; invalidate them.
# 10: the on-disk format bumped 45 → 46 (ordered index keys), so v45 datasets fail to open;
#    invalidate them.
# 11: the on-disk format bumped 46 → 47 (multi-column GIN + GIN posting runs), so v46 datasets
#    fail to open; invalidate them.
# 12: the on-disk format bumped 47 → 48 (view column defaults and options, view sequence/type
#    dependencies, multi-page catalog entries), so v47 datasets fail to open; invalidate them.
# 13: the on-disk format bumped 48 → 49 (batched durability's meta-slot rule); a reader accepts
#    only the exact current version, so invalidate the v48 datasets.
generator_version = 13

[[dataset]]
name = "small"

[[dataset.table]]
name = "orders"
rows = 10000
seed = 101

[[dataset.table.column]]
name = "id"
type = "i64"
gen = "serial"
primary_key = true

[[dataset.table.column]]
name = "customer_id"
type = "i32"
gen = "int_uniform"
min = 1
max = 1000

[[dataset.table.column]]
name = "amount"
type = "i32"
gen = "int_uniform"
min = 0
max = 99999

[[dataset.table.column]]
name = "note"
type = "text"
gen = "text"
min_len = 8
max_len = 32

[[dataset.table.index]]
name = "orders_customer_idx"
columns = ["customer_id"]

[[dataset]]
name = "large"

[[dataset.table]]
name = "orders"
rows = 1000000
seed = 201

[[dataset.table.column]]
name = "id"
type = "i64"
gen = "serial"
primary_key = true

[[dataset.table.column]]
name = "customer_id"
type = "i32"
gen = "int_uniform"
min = 1
max = 100000

[[dataset.table.column]]
name = "amount"
type = "i32"
gen = "int_uniform"
min = 0
max = 99999

[[dataset.table.column]]
name = "note"
type = "text"
gen = "text"
min_len = 8
max_len = 32

[[dataset.table.index]]
name = "orders_customer_idx"
columns = ["customer_id"]

# An EXPRESSION index over lower(note) (spec/design/indexes.md §1) — backs the expr_lookup
# benchmark's case-insensitive text lookup. The harness emits CREATE INDEX ... (lower(note)),
# a bare-function-call expression key.
[[dataset.table.index]]
name = "orders_note_lower_idx"
columns = ["lower(note)"]

# A PARTIAL index over the "big-amount" subset (spec/design/indexes.md §9) — backs the partial_lookup
# benchmark. The predicate amount >= 90000 keeps only ~10% of the 1M rows, so this narrow index is
# maintained (and seeked) for that hot subset. The name sorts BEFORE orders_customer_idx, so the
# planner's lowest-name tie-break picks the partial index for the gated query (WHERE amount >= 90000
# AND customer_id = $1). The harness emits CREATE INDEX ... (customer_id) WHERE amount >= 90000.
[[dataset.table.index]]
name = "orders_active_idx"
columns = ["customer_id"]
where = "amount >= 90000"

# GIN dataset — a single array-column table behind a GIN inverted index (spec/design/gin.md).
# jed + PostgreSQL only: SQLite has neither an array type nor GIN, so the table carries a
# table-level `engines` allowlist and bench-setup skips it for SQLite entirely. The `tags`
# column is the second open generator axis: `int_array` draws an array length in [min_len,
# max_len], then that many elements in [elem_min, elem_max] — the same "length draw, then per-
# element draws" shape as the `text` generator (benchmarks.md §4). bigint[] (not integer[]) so a
# host-bound i64 param binds cleanly into ARRAY[$1,$2] with no element-type coercion across
# jed/pgx. ~600k posting entries over 500 distinct terms ⇒ a two-term `@>` intersects to a
# handful of rows (the GIN-bounded scan's sweet spot), a two-term `&&` unions to a few thousand.
[[dataset]]
name = "gin"

[[dataset.table]]
name = "docs"
rows = 200000
seed = 301
engines = ["jed", "postgres"]

[[dataset.table.column]]
name = "id"
type = "i64"
gen = "serial"
primary_key = true

[[dataset.table.column]]
name = "tags"
type = "i64[]"
gen = "int_array"
min_len = 0
max_len = 6
elem_min = 1
elem_max = 500

[[dataset.table.index]]
name = "docs_tags_gin"
columns = ["tags"]
method = "gin"

# Text dataset — long text values that exercise the large-value storage paths
# (spec/design/large-values.md): the overflow chain and the LZ4 codec. At the default 8 KiB page a
# record over RECORD_MAX = 4082 bytes first compresses its largest value, then externalizes what
# still does not fit. `alphabet = 4` draws each character from 'a'..'d' instead of 'a'..'z', so a
# body compresses (LZ4 finds a 4-byte match almost everywhere) but only to roughly two-thirds of its
# length: the 1,000–16,000-byte bodies land in all three forms — inline plain (under RECORD_MAX),
# inline compressed, and an external chain of the compressed block. PostgreSQL TOASTs the same values
# (pglz) and SQLite moves them onto overflow pages.
[[dataset]]
name = "text"

[[dataset.table]]
name = "docs"
rows = 5000
seed = 401

[[dataset.table.column]]
name = "id"
type = "i64"
gen = "serial"
primary_key = true

[[dataset.table.column]]
name = "body"
type = "text"
gen = "text"
min_len = 1000
max_len = 16000
alphabet = 4
