services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/jed:cached
      - devstate-local:/persist/local
      - devstate-shared:/persist/shared
    command: sleep infinity
    # PostgreSQL connection settings come entirely from the checkout-local .dev/*.env files that
    # mise loads. Keeping PGHOST/PGPORT/PGUSER/PGDATABASE together there makes this container and
    # native macOS use the same environment instead of layering container-only defaults over it.

volumes:
  # per-container persistence (unique per devcontainer instance via project-name prefix)
  devstate-local:
  # shared across all containers for this project
  # pre-created in devcontainer.json's initializeCommand
  devstate-shared:
    name: devstate-shared-jed
    external: true
