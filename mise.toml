[tools]
biome = "2.5.15"
go = "1.27.1"
node = "26.10.0"
rust = "1.99.0"
"go:github.com/go-critic/go-critic/cmd/gocritic" = "latest"
"go:github.com/gordonklaus/ineffassign" = "latest"
"go:github.com/mdempsky/unconvert" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/pkgsite/cmd/pkgsite" = "latest"
"go:mvdan.cc/gofumpt" = "latest"
ruby = "4.0.7"
# The process supervisor for long-running development services (process-compose.yaml). Pinned like
# every other tool so macOS and the devcontainer run the same version. Not an engine dependency
# (CLAUDE.md §14): it never links into a core, it supervises the PostgreSQL oracle.
process-compose = '1.122.0'
# Per-checkout TCP port allocation (port-tamer.toml -> .dev/ports.env). Same reasoning as
# process-compose: a development tool, pinned so macOS and the devcontainer allocate identically,
# never linked into a core. The `github:` backend takes the prebuilt release binary, which is what
# keeps it independent of the Go toolchain this repo pins (port-tamer's own module needs a newer
# one than the Go core builds with).
"github:jackc/port-tamer" = '0.1.0'

# --- Environment -------------------------------------------------------------------------------
#
# This checkout's own service endpoints. Loading them here is what makes the per-checkout
# PostgreSQL cluster the DEFAULT: a bare `psql`, `mise run corpus:check`, and the bench harnesses
# all read PGHOST/PGPORT from the environment, so pointing those at .dev/postgres in one place moves
# every consumer at once — rather than some tools reaching a checkout-local cluster and others a
# machine-wide one, which is the split-brain the oracle profile exists to prevent.
#
# Two files with two owners, and the order matters — derived values are read after the allocation
# they come from:
#
#   .dev/ports.env     port-tamer's state file (port-tamer.toml declares the names). NAME=<port>
#                      lines only; port-tamer rewrites it canonically and rejects anything else.
#   .dev/derived.env   checkout-local PostgreSQL connection defaults (PGHOST, PGUSER, PGDATABASE)
#                      — scripts/devenv.rb.
#
# Both are generated per checkout and gitignored; `mise run dev:init` (or dev:ports:ensure) creates
# them. Their absence is not an error — mise skips a missing file, the vite/playwright configs fall
# back to their historical ports, and PG* falls back to whatever the shell already had.
[env]
_.file = ['.dev/ports.env', '.dev/derived.env']
# Keep Go builds inside the writable checkout in sandboxed environments. An explicit cache
# remains authoritative (for example, a shared CI cache).
GOCACHE = "{{ get_env(name='GOCACHE', default=config_root ~ '/.dev/go-build') }}"

# Homebrew's postgresql@18 is KEG-ONLY: nothing is linked into the prefix bin, so psql,
# pg_isready, and initdb are not on PATH after `brew install`. The scripts that need the SERVER
# binaries resolve them explicitly (scripts/lib/pg_bin.rb), but the CLIENT tools are invoked by
# name from several places — the readiness probe, `mise run db:psql`, oracle_setup, and the whole
# oracle harness — and a bare `psql` failing would take out corpus work, RQG, and benchmarks.
#
# Both standard Homebrew prefixes are listed (Apple silicon, then Intel). Neither exists on Linux,
# where a nonexistent PATH entry is simply ignored, so this is inert in the devcontainer. The major
# version tracks [cluster] pg_major in spec/conformance/oracle_profile.toml.
_.path = [
  '/opt/homebrew/opt/postgresql@18/bin',
  '/usr/local/opt/postgresql@18/bin',
]

# --- Tasks: the project's development interface -----------------------------------------------
#
# mise is the task runner (CLAUDE.md §10). Two kinds of task, one namespace (`mise tasks` lists
# them all):
#
#   * here, in mise.toml — composite tasks (a sequential list of other tasks) and straight-line
#     commands, as POSIX shell (mise runs each `run` string under `sh -o errexit`);
#   * mise-tasks/ — every task with real logic (parsing output, cross-core comparison, collecting
#     failures), as an executable Ruby script whose path is its name (mise-tasks/stress is
#     `stress`). They share scripts/lib/tasks.rb.
#
# Optional usage arguments expand with `${usage_x:+"$usage_x"}`, so an absent one adds no word.
#
# `mise run` always loads [env] above, so a task reaches this checkout's PostgreSQL cluster no
# matter which shell started it.
#
# ORDER IS DELIBERATE. mise runs a task's `depends` in PARALLEL and interleaves their output, so
# composites here list their steps as `{ task = ... }` entries in `run`, which run one after another
# and stop at the first failure. Benchmarks measure wall-clock time and must never overlap anything.
# The exceptions are `test` and `ci` (scripts/gate.rb) and `conformance:all`, which run their steps
# concurrently through scripts/lib/parallel.rb: each step's output buffered and printed in order,
# every step run to completion, and `after` ordering where two steps must not overlap. `depends` is
# used only for a task's single build prerequisite (e.g. ts:lock_build), which mise runs once per
# invocation.
#
# Task arguments use mise's usage spec: `mise run corpus:check path/to/file.test`, and
# `mise run <task> --help` prints them.

# --- Gates ------------------------------------------------------------------------------------

[tasks.default]
description = "Engine test suites (alias for test)"
run = [{ task = "test" }]

# Frozen experiments are deliberately absent from every normal composite task.
[tasks."ruby-native:conformance"]
description = "Explicit opt-in: audit the experimental pure Ruby core against the corpus"
usage = 'arg "[filter]" help="Corpus path substring"'
run = 'ruby impl/ruby-native/bin/conformance.rb ${usage_filter:+"$usage_filter"}'

[tasks."ruby-native:codegen"]
description = "Explicitly regenerate the frozen Ruby experiment's mechanical catalog and schedule"
run = ["ruby impl/ruby-native/tools/generate_catalog.rb", "ruby impl/ruby-native/tools/generate_schedule.rb"]

[tasks."ruby-native:test"]
description = "Explicit opt-in: pure Ruby experimental host/storage tests"
run = "ruby -Iimpl/ruby-native/lib -e 'Dir[\"impl/ruby-native/test/*_test.rb\"].sort.each { |f| require_relative f }'"

[tasks."ruby-native:storage-test"]
description = "Explicit opt-in: experimental Ruby storage byte and durability tests"
run = "ruby impl/ruby-native/test/storage_test.rb"

[tasks."ruby-native:bench"]
description = "Explicit opt-in: experimental Ruby against the shared benchmark corpus"
usage = '''
arg "<corpus_dir>" help="Benchmark corpus directory"
arg "<data_dir>" help="Prepared benchmark databases"
arg "<out>" help="Result JSONL path"
arg "[filter]" help="Benchmark name substring"
'''
run = 'ruby bench/ruby-native/bench_jed.rb "$usage_corpus_dir" "$usage_data_dir" "$usage_out" "${usage_filter:-}"'

[tasks."ruby-native:compare:build"]
description = "Explicit opt-in: build experimental comparison drivers"
run = "ruby bench/ruby-native/compare.rb --build-only"

[tasks."ruby-native:compare"]
description = "Explicit opt-in: preliminary memory workload comparison, interpreter and available JITs"
run = "ruby bench/ruby-native/compare.rb"

[tasks."ruby-native:compare:verify"]
description = "Explicit opt-in: validate preliminary benchmark answers without measuring timings"
run = "ruby bench/ruby-native/compare.rb --verify-only"

[tasks."ruby-native:storage-bench"]
description = "Explicit opt-in: experimental Ruby CRC and durable snapshot microbenchmarks"
run = "ruby bench/ruby-native/storage_bench.rb"

[tasks."ruby-native:compare:source-check"]
description = "Explicit opt-in: restore and verify the preserved original Ruby benchmark source"
run = "ruby bench/ruby-native/source.rb"

[tasks."ruby-native:bench:setup"]
description = "Explicit opt-in: generate standard jed-only benchmark datasets using cached Go dependencies"
run = "ruby bench/ruby-native/setup.rb"

[tasks."ruby-native:bench:smoke-go"]
description = "Explicit opt-in: canonical Go one-execution checksums for the full Ruby benchmark smoke"
usage = 'flag "--compare-only" help="Compare recorded smoke results without rerunning Go"'
run = 'ruby bench/ruby-native/shared_go_smoke.rb ${usage_compare_only:+--compare-only}'

[tasks."ruby-native:interop"]
description = "Explicit opt-in: actual Ruby/Go durable file handoff using only local core dependencies"
run = "ruby bench/ruby-native/interoperability.rb"

# `test` and `ci` run their steps concurrently, each step's output buffered and printed in order;
# the step lists live in scripts/gate.rb, where `ci` is `test` plus its extra steps by construction.
[tasks.ci]
description = "Full merge gate: spec verification, formatting, lint, tests, real-process locking, real-browser e2e, metamorphic sweep"
# A SUPERSET of `test`: adds spec-data + byte-fixture verification + codegen drift (`verify`), the
# formatter gate (`fmt`), the TS linter (`lint`), the downstream web type check (`web:check`), the
# Rust corpus walks with debug assertions + overflow checks (`conformance:all --checked`), the
# real-process shared-file corpus, the real-browser e2e suites (`e2e:ts`, `e2e:web` — they need
# `mise run dev:browsers` once), and generative differential testing — the NoREC/TLP metamorphic
# sweep + the reducer self-test.
run = "ruby scripts/gate.rb ci"

[tasks.test]
description = "Engine test suites: conformance corpus (x3 cores; plain, forced-spill, query-memory) + unit + CLI + gem + migrate"
# Example-based correctness against authored expectations — the inner dev loop.
run = "ruby scripts/gate.rb test"

[tasks.fmt]
description = "Check formatting of cores, host artifacts, tooling, and web (alias for fmt:check)"
run = [{ task = "fmt:check" }]

[tasks.lint]
description = "Lint the TypeScript core and host/tooling packages with Biome (alias for lint:check)"
run = [{ task = "lint:check" }]

# Biome's LINTER, deliberately separate from fmt so a lint finding never blocks the formatter and
# vice versa. The tailored ruleset lives in biome.json; `biome lint` exits non-zero only on ERRORS,
# so advisory warnings are surfaced without failing the gate. Scope is the TS core and host/tooling
# packages: web is prettier-only, with svelte-check (web:check) as its type gate; the @generated
# files stay excluded via biome.json.
[tasks."lint:check"]
description = "Lint the TypeScript cores with Biome's tailored ruleset (errors fail; warnings advise)"
run = "biome lint impl/ts impl/node bench/ts migrate/ts"

# Clippy over the Rust core, every target (lib, bins, in-crate tests). Only clippy's deny-by-default
# lints fail the gate (correctness bugs such as a float literal approximating a std constant); the
# warn-level backlog stays advisory and is silenced here so the gate log stays readable — run
# `cargo clippy --all-targets` in impl/rust to see it. A check build (~10s cold), so cheap to gate.
[tasks."lint:rust"]
description = "Run clippy over the Rust core's every target (deny-level lints fail; warnings silenced)"
run = "cargo clippy --manifest-path impl/rust/Cargo.toml --all-targets --quiet -- -A warnings"

[tasks."lint:fix"]
description = "Apply Biome's SAFE lint fixes to the TS cores (unsafe fixes stay per-rule + manual)"
run = "biome lint --write impl/ts impl/node bench/ts migrate/ts"

# tsc over the TS core's three programs: the Node engine + tests, the main-thread browser client,
# and the Web Worker (the DOM and WebWorker libs conflict, so they are separate configs). Node runs
# the core by type-stripping, which checks no types, and web:check's svelte-check sees only the
# modules the website imports — so without this a broken call site reaches the gate unseen.
[tasks."typecheck:ts"]
description = "Type-check the TS core with tsc (Node engine + tests, browser client, Web Worker)"
run = [
  "ruby scripts/npm_ci.rb impl/ts",
  "npx --prefix impl/ts tsc -p impl/ts/tsconfig.json",
  "npx --prefix impl/ts tsc -p impl/ts/tsconfig.browser.json",
  "npx --prefix impl/ts tsc -p impl/ts/tsconfig.worker.json",
]

# svelte-check follows the website's $jed imports into the browser-consumed TS core modules,
# catching drift at that downstream boundary as well as errors in the Svelte application.
[tasks."web:check"]
description = "Type-check the website and its browser-consumed TypeScript core modules"
run = ["ruby scripts/npm_ci.rb impl/ts", "ruby scripts/npm_ci.rb web", "npm run --silent --prefix web check"]

# --- Real-browser e2e (Playwright + headless Chromium) ------------------------------------------
# Two suites, both in `ci`: the TS core's Browser/OPFS host (spec/design/hosts.md §5 — a real
# FileSystemSyncAccessHandle in a real Worker, incl. durability across a reload) and the website's
# interactive-feature contract (CLAUDE.md §10 — the BUILT static site). Both need the Chromium build
# `mise run dev:browsers` installs; Playwright's own missing-browser error is followed by that hint.

[tasks.e2e]
description = "Run both real-browser Playwright suites (TS core OPFS host, then the website)"
run = [{ task = "e2e:ts" }, { task = "e2e:web" }]

[tasks."e2e:ts"]
description = "Run the TS core's Browser/OPFS host e2e in headless Chromium (Vite-served demo)"
run = '''
ruby scripts/npm_ci.rb impl/ts
npm run --silent --prefix impl/ts test:browser || { echo "e2e:ts failed (if Chromium is missing: mise run dev:browsers)" >&2; exit 1; }
'''

# CI=1 makes the Playwright config build the site fresh instead of reusing a server already on the
# port, which may be serving a stale build.
[tasks."e2e:web"]
description = "Build the website and run its Playwright interactive-feature suite in headless Chromium"
run = '''
ruby scripts/npm_ci.rb impl/ts
ruby scripts/npm_ci.rb web
CI=1 npm run --silent --prefix web test:browser || { echo "e2e:web failed (if Chromium is missing: mise run dev:browsers)" >&2; exit 1; }
'''

# --- Conformance (the §7 cross-core contract) ---------------------------------------------------
# Every core walks the hand-authored corpus (spec/conformance/suites) TWICE — the two storage modes
# of spec/design/conformance.md §3: "memory" (a fresh in-memory Database) and "disk" (a file-backed
# database reopened before every record, so committed reads fault their leaves from disk). Every
# record's rows/error/cost must be IDENTICAL in both modes. Rust runs RELEASE: the debug evaluator's
# giant frames overflow the native stack on resource/depth_limit.test's deep nesting. The `checked`
# Cargo profile (release + debug assertions + overflow checks) is how Rust gets assertion coverage.

[tasks.conformance]
description = "Walk the conformance corpus on all three cores"
run = [{ task = "conformance:rust" }, { task = "conformance:go" }, { task = "conformance:ts" }]

[tasks."conformance:rust"]
description = "Walk the conformance corpus on the Rust core, both storage modes (release)"
run = [
  "cargo run --release --quiet --bin conformance --manifest-path impl/rust/Cargo.toml",
  "cargo run --release --quiet --bin conformance --manifest-path impl/rust/Cargo.toml -- disk",
]

# The corpus's debug-assertion / integer-overflow-check pass, in CI (not `test`, to keep the inner
# loop to one Rust build). The `checked` profile in impl/rust/Cargo.toml keeps release frames, so
# resource/depth_limit.test fits the stack — a debug build aborts there and never reaches the rest.
[tasks."conformance:rust:checked"]
description = "Walk the conformance corpus on the Rust core, both storage modes, with debug assertions + overflow checks"
run = [
  "cargo run --profile checked --quiet --bin conformance --manifest-path impl/rust/Cargo.toml",
  "cargo run --profile checked --quiet --bin conformance --manifest-path impl/rust/Cargo.toml -- disk",
]

[tasks."conformance:go"]
description = "Walk the conformance corpus on the Go core, both storage modes"
dir = "{{config_root}}/impl/go"
run = ["go run ./cmd/conformance", "go run ./cmd/conformance disk"]

[tasks."conformance:ts"]
description = "Walk the conformance corpus on the TS core, both storage modes"
depends = ["ts:lock_build"]
dir = "{{config_root}}/impl/ts"
run = ["npm run --silent conformance", "npm run --silent conformance -- disk"]

# The TS disk mode with every reopen through the async loader under a page codec that has ONLY
# asynchronous forms, and every record driven by runAsync (spec/design/ts-runtime.md §11.5): a
# synchronous page read left on a query, DDL, or commit path fails. Results, errors, and costs must be
# unchanged. Also part of conformance:all.
[tasks."conformance:ts:async-codec"]
description = "Walk the conformance corpus on the TS core through an asynchronous-only page codec"
usage = 'arg "[filter]" help="Run only corpus files whose path contains this substring"'
depends = ["ts:lock_build"]
dir = "{{config_root}}/impl/ts"
run = 'JED_CONFORMANCE_FILTER="${usage_filter:-}" node src/bin/conformance.ts async-codec'

# Disk storage mode with a tiny work_mem, so every spill-capable operator spills
# (spec/design/spill.md). Results, errors, and costs must be unchanged.
[tasks."conformance:spill"]
description = "Run the shared SQL corpus on all cores with forced file spill (operators, then temp tables)"
usage = '''
arg "[bytes]" default="256" help="work_mem in bytes"
arg "[filter]" help="Run only corpus files whose path contains this substring"
'''
run = '''
if [ -n "${usage_filter:-}" ]; then export JED_CONFORMANCE_FILTER="$usage_filter"; fi
JED_CONFORMANCE_WORK_MEM="$usage_bytes" cargo run --release --quiet --bin conformance --manifest-path impl/rust/Cargo.toml -- disk
(cd impl/go && JED_CONFORMANCE_WORK_MEM="$usage_bytes" go run ./cmd/conformance disk)
(cd impl/ts && JED_CONFORMANCE_WORK_MEM="$usage_bytes" node src/bin/conformance.ts disk)
# Temp-table spill (spec/design/temp-tables.md §6): the temp-table files in memory mode, each memory
# database given a spill directory and every session a 1-byte temp_buffers, so each temp domain
# spills to a scratch file at its first commit and runs on a one-leaf page cache.
export JED_CONFORMANCE_TEMP_BUFFERS=1
cargo run --release --quiet --bin conformance --manifest-path impl/rust/Cargo.toml
(cd impl/go && go run ./cmd/conformance)
(cd impl/ts && node src/bin/conformance.ts)
'''

# The corpus through a page client (spec/pageservice/README.md §7): each core runs the disk mode with
# every query record answered as a page client of another core's owner (the default
# `locking = auto`). Rows, errors, plans, and costs must be unchanged. Also part of conformance:all.
[tasks."conformance:service"]
description = "Run the corpus with each core as a page client of another core's owner (Rust->Go, Go->TS, TS->Rust)"
depends = ["ts:lock_build"]
run = [
  "cargo build --release --bin process_actor --bin conformance --manifest-path impl/rust/Cargo.toml",
  "cd impl/go && go build -o process_actor ./cmd/process_actor",
  "JED_SERVICE_OWNER=go impl/rust/target/release/conformance service",
  "cd impl/go && JED_SERVICE_OWNER=node go run ./cmd/conformance service",
  "cd impl/ts && JED_SERVICE_OWNER=rust node src/bin/conformance.ts service",
]

# Layer 4 of the concurrency contract (CLAUDE.md §7): spec/conformance/process/*.process.toml drives
# real Rust/Go/Node actor processes over one shared file. Part of `ci`.
[tasks."concurrency:process"]
description = "Run the real-process corpus (the page service, exclusive owners, attachments) across every Rust/Go/Node pairing"
depends = ["ts:lock_build"]
run = [
  "cargo build --release --bin process_actor --manifest-path impl/rust/Cargo.toml",
  "cd impl/go && go build -o process_actor ./cmd/process_actor",
  "ruby scripts/process_conformance.rb",
]

# The stepped-THREADED concurrency conformance (spec/design/concurrency-testing.md §4.3), run under
# the race detector: the same `# format: concurrency` schedules the corpus walk runs sequentially,
# in the opt-in threaded mode, against the real concurrent code paths. Not in `ci` (it needs the
# race-instrumented toolchains); run it when touching the shared-handle concurrency model. TS has
# no threaded mode, so it is not run here.
[tasks."concurrency:race"]
description = "Run the stepped-threaded concurrency conformance under the race detector (Go + Rust)"
run = [
  "cd impl/go && go test -race -run TestConcurrencySchedulesThreaded ./cmd/conformance",
  # Run from impl/rust (not --manifest-path from the root) so cargo finds impl/rust/.cargo/config.toml
  # and gives this DEBUG build's test threads the 8 MiB RUST_MIN_STACK; cargo reads config from the cwd.
  "cd impl/rust && cargo test --bin conformance",
]

# Deterministic simulation testing (spec/design/simulation-testing.md): seeded multi-session
# histories over a fault-injecting simulated disk, checked by recovery, durability, isolation, and
# integrity oracles. `ci` runs the committed regression traces (spec/conformance/sim/regress) and a
# fixed eight-seed sweep of every profile; longer sweeps are bench-family and stay outside it.
[tasks."sim:sweep"]
description = "Simulation sweep: generate traces, run them on the cores; fails on any oracle violation or disagreement"
usage = '''
arg "[seeds]" default="1..50" help="Seed range, e.g. 1..200"
arg "[profile]" default="all" help="A profile under spec/conformance/sim/profiles, or all"
arg "[cores]" default="go,rust,ts" help="Comma-separated subset of go,rust,ts"
'''
run = 'ruby scripts/sim.rb sweep --seeds "${usage_seeds}" --profile "${usage_profile}" --cores "${usage_cores}"'

[tasks."sim:regress"]
description = "Run the committed simulation regression traces on the cores"
usage = 'arg "[cores]" default="go,rust,ts" help="Comma-separated subset of go,rust,ts"'
run = 'ruby scripts/sim.rb regress --cores "${usage_cores}"'

[tasks."sim:replay"]
description = "Rerun one simulation trace and keep its transcripts"
usage = '''
arg "<trace>" help="The .sim file"
arg "[cores]" default="go,rust,ts" help="Comma-separated subset of go,rust,ts"
'''
run = 'ruby scripts/sim.rb replay "${usage_trace}" --cores "${usage_cores}"'

[tasks."sim:shrink"]
description = "Shrink a failing simulation trace to a minimal one (ddmin over steps)"
usage = '''
arg "<trace>" help="The failing .sim file"
arg "[core]" default="go" help="The core it fails on, or two (go,rust) whose disagreement to shrink"
'''
run = 'ruby scripts/sim.rb shrink "${usage_trace}" --core "${usage_core}"'

[tasks."sim:plant"]
description = "Check the simulator still catches each deliberately planted Go-core storage bug"
usage = 'arg "[seeds]" default="1..60" help="Seed range per planted bug"'
run = 'ruby scripts/sim_plant.rb "${usage_seeds}"'

# --- Unit suites --------------------------------------------------------------------------------
# Each core's per-language unit + integration suite: the checks the corpus CANNOT express
# (CLAUDE.md §10). Rust runs RELEASE for the same depth_limit native-stack reason as conformance.

[tasks.unit]
description = "Run every core's per-language unit + integration suite"
run = [{ task = "unit:rust" }, { task = "unit:go" }, { task = "unit:ts" }]

[tasks."unit:rust"]
description = "Run the Rust core's unit + integration tests (release)"
run = "cargo test --release --manifest-path impl/rust/Cargo.toml"

[tasks."unit:go"]
description = "Run the Go core's unit tests"
dir = "{{config_root}}/impl/go"
run = "go test ./..."

[tasks."unit:ts"]
description = "Run the TS core's unit tests"
depends = ["ts:lock_build"]
dir = "{{config_root}}/impl/ts"
run = "npm run --silent test"

# --- Host programs and artifacts ---------------------------------------------------------------
# The jed CLI (spec/design/cli.md) is a standalone crate so its TUI dependencies never enter the
# zero-dep cores. jed-migrate (/migrate/design.md) is a consumer of the engine, one package per
# core, verified against the shared /migrate/testdata corpus. Both run in `test`.

[tasks."cli:build"]
description = "Build the jed CLI (release) to cli/target/release/jed"
run = "cargo build --release --manifest-path cli/Cargo.toml"

[tasks."cli:test"]
description = "Run the jed CLI's unit + end-to-end golden tests"
run = "cargo test --manifest-path cli/Cargo.toml"

[tasks."migrate:test"]
description = "Run the jed-migrate packages' tests on all three cores (Go + Rust + TS)"
run = [{ task = "migrate:test:go" }, { task = "migrate:test:rust" }, { task = "migrate:test:ts" }]

[tasks."migrate:test:go"]
description = "Run the Go jed-migrate package's tests"
dir = "{{config_root}}/migrate/go"
run = "go test ./..."

[tasks."migrate:test:rust"]
description = "Run the Rust jed-migrate crate's tests"
run = "cargo test --manifest-path migrate/rust/Cargo.toml"

[tasks."migrate:test:ts"]
description = "Run the TS jed-migrate package's tests (bare Node via type-stripping — no install)"
depends = ["ts:lock_build"]
run = "node --test migrate/ts/tests/*.test.ts"

[tasks."ruby:build"]
description = "Build the Ruby gem's native extension cdylib (release) to impl/ruby/ext/target/release"
run = "cargo build --release --manifest-path impl/ruby/ext/Cargo.toml"

# The jed Ruby gem (spec/design/ruby.md) WRAPS the safe Rust core; its minitest suite tests the
# BINDING SEAM only (marshalling, lifecycle) — SQL semantics stay in the shared corpus. minitest is a
# Ruby bundled gem, resolved from the mise Ruby install (no Gemfile entry, no new dependency).
[tasks."ruby:test"]
description = "Build the cdylib, then run the Ruby gem's minitest seam tests"
depends = ["ruby:build"]
run = '''
ruby -Iimpl/ruby/lib -Iimpl/ruby/test -e 'ARGV.each { |f| require File.expand_path(f) }' -- impl/ruby/test/*_test.rb
'''

# An EXPERIMENTAL native Node-API host artifact wrapping the safe Rust core — not a fourth core. It
# measures shipping the independent TypeScript core against shipping a Node package backed by Rust
# (spec/design/benchmarks.md §7.3); exact-pinned napi-rs crates build the local .node module.
[tasks."node:build"]
description = "Build the experimental native Node/Rust package"
run = '''
cargo build --release --manifest-path impl/node/Cargo.toml
case "$(uname -s)" in
  Darwin) lib=libjed_node.dylib ;;
  MINGW*|MSYS*|CYGWIN*) lib=jed_node.dll ;;
  *) lib=libjed_node.so ;;
esac
cp "impl/node/target/release/$lib" impl/node/jed_node.node
'''

[tasks."node:test"]
description = "Build and run the experimental native Node/Rust package seam tests"
depends = ["node:build"]
run = "node --test impl/node/test/*.test.ts"

# The production narrow Node-API OS-lock host for the independent TypeScript core
# (spec/design/locking.md §8). It exposes no SQL/storage behavior; the TypeScript engine remains an
# independent conformance voice.
[tasks."ts:lock_build"]
description = "Build the TypeScript core's narrow native OS-lock adapter (and install its npm deps)"
run = '''
# Every task that runs the TS core depends on this one, so it also installs the core's runtime npm
# dependency (@noble/hashes, CLAUDE.md §14) before any of them starts.
ruby scripts/npm_ci.rb impl/ts
cargo build --release --manifest-path impl/ts/native-lock/Cargo.toml
case "$(uname -s)" in
  Darwin) lib=libjed_lock.dylib ;;
  MINGW*|MSYS*|CYGWIN*) lib=jed_lock.dll ;;
  *) lib=libjed_lock.so ;;
esac
# Replace the addon only when it changed, and by rename: steps that depend on this task run
# concurrently under `mise run ci`, and one may be loading the addon while another copies it.
if ! cmp -s "impl/ts/native-lock/target/release/$lib" impl/ts/jed_lock.node; then
  cp "impl/ts/native-lock/target/release/$lib" "impl/ts/jed_lock.node.$$"
  mv -f "impl/ts/jed_lock.node.$$" impl/ts/jed_lock.node
fi
'''

# --- Oracle (the live PostgreSQL differential oracle) ------------------------------------------
# Corpus expectations are calibrated to the profile in spec/conformance/oracle_profile.toml: the
# locale provider, tzdata, and a dozen session GUCs change what PostgreSQL answers — in VALUES, not
# just formatting. Cluster facts are ASSERTED at connect (every corpus:*/rqg:* task gets this
# through PgOracle); session settings are APPLIED in each probe's preamble.

[tasks."oracle:setup"]
description = "Create/verify the oracle database declared in the profile"
run = "ruby scripts/oracle_setup.rb"

[tasks."oracle:reset"]
description = "Drop every replayed object from the oracle database (keeps the database + its locale)"
run = "ruby scripts/oracle_setup.rb --reset"

[tasks."oracle:status"]
description = "Print the declared oracle profile beside the live server's values (fails on mismatch)"
run = "ruby scripts/oracle_status.rb"

[tasks."oracle:check"]
description = "Assert the live oracle matches the declared profile (exit nonzero on mismatch)"
run = '''ruby -e 'require "./scripts/lib/pg_oracle"; PgOracle.new(label: "check"); puts "OK: live oracle matches spec/conformance/oracle_profile.toml"' '''

# --- Corpus and RQG tools (CLAUDE.md §7) ---------------------------------------------------------
# These talk to the LIVE PostgreSQL oracle, never the reference source checkout. psql-only (no `pg`
# gem). RQG generates random SQL over jed's supported subset and checks it against PG; it is slow
# and needs the live oracle, so it stays OUTSIDE `ci` — what flows into `ci` is the emitted
# suites/rqg/*.test.

[tasks."corpus:check"]
description = "Check a .test's expected output against the live PostgreSQL oracle (no write)"
usage = 'arg "<file>" help="The .test file to check"'
run = 'ruby scripts/oracle_import.rb --check "${usage_file}"'

[tasks."corpus:import"]
description = "Fill a .test's expected output from the live PostgreSQL oracle (writes the file)"
usage = 'arg "<file>" help="The .test file to fill"'
run = 'ruby scripts/oracle_import.rb "${usage_file}"'

[tasks."corpus:norec"]
description = "Generate one metamorphic NoREC seed (SQLancer-style) and run it on Go + TS"
usage = 'arg "[seed]" help="The seed (default: random)"'
run = 'ruby scripts/norec_gen.rb ${usage_seed:+"$usage_seed"}'

# A fixed, reproducible sweep of seeds 1..N generated into suites/metamorphic, run once per core,
# and removed. Runs all THREE cores, so each seed is checked metamorphically (optimized vs full
# scan agree) AND differentially (the cores agree). Default N=20 (= 100 metamorphic pairs/core).
[tasks."corpus:norec_sweep"]
description = "CI sweep: N reproducible NoREC seeds (default 20) on all three cores; fails on any divergence"
usage = 'arg "[count]" default="20" help="Number of seeds"'
run = 'ruby scripts/norec_gen.rb --sweep "${usage_count}"'

[tasks."corpus:reduce"]
description = "Reduce a failing .test to a minimal one (ddmin)"
usage = '''
arg "<file>" help="The failing .test file"
arg "[core]" help="rust, go, or ts (default rust)"
'''
run = 'ruby scripts/reduce.rb "${usage_file}" ${usage_core:+--core "$usage_core"}'

[tasks."corpus:reduce_selftest"]
description = "Self-test the reducer on a fixed synthetic failure (rust-only, oracle-free)"
run = "ruby scripts/reduce_selftest.rb"

[tasks."rqg:run"]
description = "Run one RQG case across every shape; check vs PG, no corpus emit"
usage = 'arg "[seed]" default="1" help="The seed"'
run = 'ruby scripts/rqg_gen.rb "${usage_seed}"'

[tasks."rqg:sweep"]
description = "RQG sweep: N seeds vs PG; flag + reduce divergences, no corpus emit"
usage = 'arg "[count]" default="200" help="Number of seeds"'
run = 'ruby scripts/rqg_gen.rb --sweep "${usage_count}"'

[tasks."rqg:emit"]
description = "RQG sweep + emit curated/capped/deduped agreements to suites/rqg/"
usage = 'arg "[count]" default="300" help="Number of seeds"'
run = 'ruby scripts/rqg_gen.rb --sweep "${usage_count}" --emit'

[tasks."rqg:replay"]
description = "Reproduce one RQG case"
usage = '''
arg "<seed>" help="The seed"
arg "[shape]" help="Restrict to this shape"
'''
run = 'ruby scripts/rqg_gen.rb "${usage_seed}" ${usage_shape:+--shapes "$usage_shape"}'

[tasks."rqg:reduce"]
description = "Reduce a flagged RQG .test to a minimal one (ddmin)"
usage = '''
arg "<file>" help="The flagged .test file"
arg "[core]" help="rust, go, or ts (default rust)"
'''
run = 'ruby scripts/reduce.rb "${usage_file}" ${usage_core:+--core "$usage_core"}'

# --- Benchmarks (spec/design/benchmarks.md; OUTSIDE ci) ------------------------------------------
# Wall-clock timings are environment-relative and nondeterministic, so these stay out of `ci`. The
# answers are still checked: every result carries a cross-engine checksum and bench:report fails on
# any disagreement. bench:durability and bench:durable_commit live in mise-tasks/bench/.

# Every Go binary except the cgo SQLite baseline builds with CGO_ENABLED=0, proving the cgo surface
# stays confined to bench-sqlite-cgo (benchmarks.md §7). The Ruby gem bench needs the gem's native
# extension, and the wasm bench needs the core compiled to wasm32-wasip1 (`mise run dev:init` adds
# the rustup target).
[tasks."bench:build"]
description = "Build all benchmark binaries and wrapped host artifacts"
depends = ["node:build"]
run = [
  "cd bench/go && CGO_ENABLED=0 go build -o bin/ ./cmd/bench-setup ./cmd/bench-jed ./cmd/bench-pg ./cmd/bench-sqlite",
  "cd bench/go && CGO_ENABLED=1 go build -o bin/ ./cmd/bench-sqlite-cgo",
  "cargo build --release --quiet --manifest-path bench/rust/Cargo.toml",
  { task = "ts:lock_build" }, # the TS harness opens through Database (Node file locking); installs impl/ts deps
  "ruby scripts/npm_ci.rb bench/ts",
  "cargo build --release --quiet --manifest-path impl/ruby/ext/Cargo.toml",
  "cargo build --release --quiet --target wasm32-wasip1 --manifest-path impl/wasm/Cargo.toml",
]

[tasks."bench:setup"]
description = "Generate/refresh the benchmark databases (fingerprint-gated; --force to override)"
usage = 'flag "--force" help="Regenerate even when the fingerprints match"'
run = [
  "cd bench/go && CGO_ENABLED=0 go build -o bin/ ./cmd/bench-setup",
  "bench/go/bin/bench-setup bench/corpus bench/data ${usage_force:+--force}",
]

# Every harness runs one after another (they measure wall-clock time), then the report. The Ruby gem
# bench (jed/ruby/wrap) measures the binding overhead against jed/rust/core; the wasm wrap
# (jed/wasm/wrap) runs the Rust core compiled to wasm32-wasip1 over node:wasi, whose preview1 host
# needs the --experimental flag.
[tasks."bench:run"]
description = "Run every benchmark binary sequentially; results to bench/results/<stamp>/ + report"
depends = ["bench:build"]
usage = 'arg "[filter]" help="Run only benchmarks whose name contains this substring"'
run = '''
dir="bench/results/$(date -u +%Y%m%d-%H%M%S)"
mkdir -p "$dir"
for bin in bench-jed bench-pg bench-sqlite bench-sqlite-cgo; do
  "bench/go/bin/$bin" bench/corpus bench/data "$dir/go-$bin.jsonl" ${usage_filter:+"$usage_filter"}
done
for bin in bench-jed bench-pg bench-sqlite; do
  "bench/rust/target/release/$bin" bench/corpus bench/data "$dir/rust-$bin.jsonl" ${usage_filter:+"$usage_filter"}
done
for bin in bench-jed bench-pg bench-sqlite; do
  node "bench/ts/src/$bin.ts" bench/corpus bench/data "$dir/ts-$bin.jsonl" ${usage_filter:+"$usage_filter"}
done
node bench/ts/src/bench-node-rust.ts bench/corpus bench/data "$dir/node-rust-bench-jed.jsonl" ${usage_filter:+"$usage_filter"}
ruby bench/ruby/bench_jed.rb bench/corpus bench/data "$dir/ruby-bench-jed.jsonl" ${usage_filter:+"$usage_filter"}
node --experimental-wasi-unstable-preview1 bench/ts/src/bench-wasm.ts bench/corpus bench/data "$dir/wasm-bench-jed.jsonl" ${usage_filter:+"$usage_filter"}
ruby scripts/bench_report.rb "$dir"
ruby scripts/bench_html.rb "$dir"
'''

[tasks."bench:node_compare"]
description = "Compare every jed benchmark through pure TS, Node/Rust wrap, and native Rust control"
depends = ["node:build", "ts:lock_build"]
usage = 'arg "[filter]" help="Run only benchmarks whose name contains this substring"'
run = '''
ruby scripts/npm_ci.rb bench/ts
cargo build --release --quiet --manifest-path bench/rust/Cargo.toml --bin bench-jed
dir="bench/results/$(date -u +%Y%m%d-%H%M%S)-node-compare"
mkdir -p "$dir"
node bench/ts/src/bench-jed.ts bench/corpus bench/data "$dir/ts-bench-jed.jsonl" ${usage_filter:+"$usage_filter"}
node bench/ts/src/bench-node-rust.ts bench/corpus bench/data "$dir/node-rust-bench-jed.jsonl" ${usage_filter:+"$usage_filter"}
bench/rust/target/release/bench-jed bench/corpus bench/data "$dir/rust-bench-jed.jsonl" ${usage_filter:+"$usage_filter"}
ruby scripts/bench_report.rb "$dir"
ruby scripts/bench_markdown.rb "$dir"
'''

[tasks."bench:report"]
description = "Aggregate a results dir into a comparison table (default: newest)"
usage = 'arg "[dir]" help="The results directory"'
run = 'ruby scripts/bench_report.rb ${usage_dir:+"$usage_dir"}'

[tasks."bench:html"]
description = "Static HTML report for a results dir (default: newest, diffed against the previous run)"
usage = '''
arg "[dir]" help="The results directory"
arg "[baseline]" help="The results directory to diff against"
'''
run = 'ruby scripts/bench_html.rb ${usage_dir:+"$usage_dir"} ${usage_baseline:+"$usage_baseline"}'

[tasks."bench:markdown"]
description = "Markdown report to stdout + <dir>/report.md (default: newest, diffed against the previous run)"
usage = '''
arg "[dir]" help="The results directory"
arg "[baseline]" help="The results directory to diff against"
'''
run = 'ruby scripts/bench_markdown.rb ${usage_dir:+"$usage_dir"} ${usage_baseline:+"$usage_baseline"}'

[tasks."bench:diff"]
description = "Machine-readable JSONL diff of two runs (default: newest vs previous)"
usage = '''
arg "[dir]" help="The results directory"
arg "[baseline]" help="The results directory to diff against"
'''
run = 'ruby scripts/bench_diff.rb ${usage_dir:+"$usage_dir"} ${usage_baseline:+"$usage_baseline"}'

[tasks."bench:spill"]
description = "Compare bounded JOIN/aggregate/DISTINCT with unlimited work_mem, and spilled vs resident temp tables (larger than work memory)"
usage = '''
arg "[rows]" help="Rows per input"
arg "[width]" help="Payload width in bytes"
arg "[budget]" help="work_mem budget in bytes"
'''
run = 'ruby scripts/spill_bench.rb ${usage_rows:+"$usage_rows"} ${usage_width:+"$usage_width"} ${usage_budget:+"$usage_budget"}'

# --- Explorers (slow analysis tools; OUTSIDE ci) ------------------------------------------------
# Coverage-guided fuzzing of the Go core's crash / corruption durability surface. The oracle is
# INTRINSIC — never crash, never loop, fail closed. The fuzz seed corpora still run inside `ci` via
# unit:go (every f.Add seed executes under a plain `go test`); `-fuzz` just explores wider.

[tasks.fuzz]
description = "Run every crash/corruption fuzz target (default 60s each)"
usage = 'arg "[time]" default="60s" help="Fuzz time per target, e.g. 120s"'
dir = "{{config_root}}/impl/go"
run = '''
for name in FuzzCorruptFile FuzzCommitCrash; do
  go test -run '^$' -fuzz "^$name\$" -fuzztime "$usage_time" ./
done
'''

[tasks."fuzz:one"]
description = "Fuzz one crash/corruption target (default 60s)"
usage = '''
arg "<name>" help="The fuzz target, e.g. FuzzCorruptFile or FuzzCommitCrash"
arg "[time]" default="60s" help="Fuzz time, e.g. 300s"
'''
dir = "{{config_root}}/impl/go"
run = 'go test -run "^$" -fuzz "^${usage_name}\$" -fuzztime "$usage_time" ./'

# Mutation-testing of the Go core (spec/design/mutation-testing.md): inject deliberate bugs and check
# the conformance corpus catches each one; a SURVIVING mutant is untested logic, located precisely.
# Survivors make the runner exit non-zero, which is a result, not a task failure — the printed
# report and the JSONL under bench/results/mutation/<stamp>/ are the deliverable.
#   mise run mutation                    # default targets, 300 sampled
#   mise run mutation value.go           # one file, full sweep
#   mise run mutation value.go 500 7     # file, max mutants, sample seed
[tasks.mutation]
description = "Mutation-test the Go core: inject bugs, check the conformance corpus catches them"
usage = '''
arg "[files]" help="Go source files to mutate (relative to impl/go, comma-separated)"
arg "[n]" help="Maximum number of mutants"
arg "[seed]" help="Sample seed"
'''
run = '''
dir="$PWD/bench/results/mutation/$(date -u +%Y%m%d-%H%M%S)"
mkdir -p "$dir"
cd impl/go
go run ./cmd/mutate -json "$dir/go.jsonl" ${usage_files:+-files "$usage_files"} ${usage_n:+-n "$usage_n"} ${usage_seed:+-seed "$usage_seed"} || true
'''

# --- Bootstrap ---------------------------------------------------------------------------------

[tasks."dev:init"]
description = "Bootstrap this checkout: Ruby gems, npm dev deps, and this worktree's ports"
run = [
  "bundle install",
  "npm ci --silent --prefix impl/ts",
  "npm ci --silent --prefix web",
  { task = "dev:ports:ensure" },
  # The WASM bench target (bench/ts/src/bench-wasm.ts drives the core compiled to wasm32-wasip1).
  # rustup state lives in the container's home, NOT on the persist volume, so a devcontainer
  # rebuild silently loses this and `mise run bench:run` then fails on a cargo target error. It was
  # a documented manual step; bootstrap is where it belongs. Tolerant of a non-rustup toolchain.
  "command -v rustup >/dev/null && rustup target add wasm32-wasip1 || echo 'skip: no rustup; add the wasm32-wasip1 target manually for bench:*'",
]

[tasks."dev:browsers"]
description = "Install the Chromium build the browser e2e suites drive (impl/ts + web)"
# Separate from dev:init because it is a ~150 MB download that only the two Playwright suites need
# (e2e:ts, e2e:web — part of `ci`, not `test`). --with-deps installs OS packages via apt and exists only on Linux, so it is
# applied there and omitted elsewhere; on macOS the browser bundle is self-contained.
run = '''
if [ "$(uname -s)" = "Linux" ]; then deps="--with-deps"; else deps=""; fi
for dir in impl/ts web; do (cd "$dir" && npx playwright install $deps chromium); done
'''

[tasks.dev]
description = "Start this checkout's long-running services (PostgreSQL oracle) under process-compose"
run = "ruby scripts/dev.rb"

# --- Per-worktree ports ------------------------------------------------------------------------
# A git worktree is the native equivalent of a second devcontainer instance; these give it a
# private group of TCP ports so several checkouts can serve simultaneously. The allocation is
# port-tamer's (port-tamer.toml); scripts/devenv.rb drives it and derives PGHOST.

[tasks."dev:ports:show"]
description = "Print this worktree's TCP port allocation and whether each port is listening"
alias = "dev:ports"
run = "ruby scripts/devenv.rb show"

[tasks."dev:ports:ensure"]
description = "Allocate this worktree's ports if it has none (idempotent)"
run = "ruby scripts/devenv.rb ensure"

[tasks."dev:ports:overwrite"]
description = "Move this worktree to a different port group (stop its services first)"
run = "ruby scripts/devenv.rb overwrite"

# --- This checkout's PostgreSQL cluster (scripts/devdb.rb) --------------------------------------
# One cluster per checkout, not databases inside a shared server: destructive resets stay local
# and two checkouts run at once. The SERVER runs in the foreground under process-compose
# (process-compose.yaml); these are the one-shot half.

[tasks."db:init"]
description = "Create this checkout's PostgreSQL cluster under .dev/postgres (idempotent)"
run = "ruby scripts/devdb.rb init"

[tasks."db:psql"]
description = "psql against this checkout's cluster"
raw = true
run = "ruby scripts/devdb.rb psql"

[tasks."db:reset"]
description = "Destroy this checkout's cluster and re-init (destructive; CONFIRM=yes)"
run = "ruby scripts/devdb.rb reset"

[tasks."bench:cancellation:go"]
description = "Cancellation engine, watcher/channel and caller setup measurements"
dir = "{{config_root}}/impl/go"
run = "go test -run '^$' -bench '^BenchmarkCancellation' -benchmem -benchtime=500ms -count=3"

[tasks."bench:cancellation:rust"]
description = "Cancellation engine and caller token measurements"
run = "cargo test --release --manifest-path impl/rust/Cargo.toml cancellation_benchmark -- --ignored --nocapture --test-threads=1"

[tasks."bench:cancellation:latency"]
description = "Timer-driven cancellation response latency in Go and Rust"
run = [
  "cd impl/go && JED_CANCEL_LATENCY=1 go test -run '^TestCancellationLatencyMeasurement$' -v",
  "cargo test --release --manifest-path impl/rust/Cargo.toml cancellation_latency_measurement -- --ignored --nocapture --test-threads=1",
]

[tasks."test:cancellation:race"]
description = "Go cursor cancellation and host API regressions under the race detector"
dir = "{{config_root}}/impl/go"
run = "go test -race -run 'Test.*(Cancel|Ergo|Streaming|Deferred|Drain|HostFunc)' ./..."
