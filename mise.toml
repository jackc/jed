[tools]
biome = '2.5.0'
go = '1.26.3'
node = '24.16.0'
rust = '1.92.0'
"go:github.com/go-critic/go-critic/cmd/gocritic" = "latest"
"go:github.com/gordonklaus/ineffassign" = "latest"
"go:github.com/mdempsky/unconvert" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/pkgsite/cmd/pkgsite" = "latest"
"go:mvdan.cc/gofumpt" = "latest"
ruby = '4.0.5'
# The process supervisor for long-running development services (process-compose.yaml). Pinned like
# every other tool so macOS and the devcontainer run the same version. Not an engine dependency
# (CLAUDE.md §14): it never links into a core, it supervises the PostgreSQL oracle.
process-compose = '1.122.0'

# --- Environment -------------------------------------------------------------------------------
#
# This checkout's own service endpoints (scripts/devports.rb). Loading them here is what makes the
# per-checkout PostgreSQL cluster the DEFAULT: a bare `psql`, `rake corpus:check`, and the bench
# harnesses all read PGHOST/PGPORT from the environment, so pointing those at .dev/postgres in one
# place moves every consumer at once — rather than some tools reaching a checkout-local cluster and
# others a machine-wide one, which is the split-brain the oracle profile exists to prevent.
#
# The file is generated per checkout and gitignored; `mise run dev:init` (or dev:ports:ensure)
# creates it. Its absence is not an error — mise skips a missing file, the vite/playwright configs
# fall back to their historical ports, and PG* falls back to whatever the shell already had.
[env]
_.file = '.dev/ports.env'

# --- Tasks: the project's development interface -----------------------------------------------
#
# These wrap the Rake surface rather than replacing it (the Rakefile is ~1,400 lines of real Ruby
# — codegen drivers, the conformance walkers, the oracle/RQG tools — and CLAUDE.md §10 prefers Ruby
# + Rake for exactly that). The point of the wrapper is a SINGLE entry point that behaves the same
# on native macOS, inside the devcontainer, and in CI: `mise run ci` is `mise run ci` everywhere.
#
# `bundle exec` is deliberate: it pins rake + toml-rb to Gemfile.lock rather than to whatever the
# ambient gem set happens to hold. Add a task here when a workflow should be reachable without
# knowing it is Rake underneath; keep the implementation in the Rakefile.

[tasks.ci]
description = "Full merge gate: spec verification, formatting, lint, tests, real-process locking"
run = "bundle exec rake ci"

[tasks.test]
description = "Engine test suites: conformance corpus (x3 cores) + unit + CLI + gem + migrate"
run = "bundle exec rake test"

[tasks.verify]
description = "Verify the spec data tables and byte fixtures (toolchain-light; no engine build)"
run = "bundle exec rake verify"

[tasks.conformance]
description = "Walk the conformance corpus on all three cores"
run = "bundle exec rake conformance"

[tasks.fmt]
description = "Check formatting of cores, host artifacts, tooling, and web"
run = "bundle exec rake fmt"

[tasks."fmt:fix"]
description = "Rewrite sources with the pinned formatters"
run = "bundle exec rake fmt:fix"

[tasks.lint]
description = "Lint the TypeScript core and host/tooling packages with Biome"
run = "bundle exec rake lint"

# --- Oracle (the live PostgreSQL differential oracle) ------------------------------------------
# Corpus expectations are calibrated to the profile in spec/conformance/oracle_profile.toml; these
# provision and inspect the server that has to match it.

[tasks."oracle:setup"]
description = "Create/verify the oracle database declared in the profile"
run = "bundle exec rake oracle:setup"

[tasks."oracle:status"]
description = "Print the declared oracle profile beside the live server's values"
run = "bundle exec rake oracle:status"

[tasks."oracle:reset"]
description = "Drop every replayed object from the oracle database"
run = "bundle exec rake oracle:reset"

# --- Bootstrap ---------------------------------------------------------------------------------

[tasks."dev:init"]
description = "Bootstrap this checkout: Ruby gems, npm dev deps, and this worktree's port block"
run = [
  "bundle install",
  "npm ci --silent --prefix impl/ts",
  "npm ci --silent --prefix web",
  "bundle exec rake dev:ports:ensure",
  # The WASM bench target (bench/ts/src/bench-wasm.ts drives the core compiled to wasm32-wasip1).
  # rustup state lives in the container's home, NOT on the persist volume, so a devcontainer
  # rebuild silently loses this and `rake bench:run` then fails on a cargo target error. It was a
  # documented manual step; bootstrap is where it belongs. Tolerant of a non-rustup toolchain.
  "command -v rustup >/dev/null && rustup target add wasm32-wasip1 || echo 'skip: no rustup; add the wasm32-wasip1 target manually for rake bench:*'",
]

# --- Per-worktree ports ------------------------------------------------------------------------
# A git worktree is the native equivalent of a second devcontainer instance; these give it a
# private TCP port block so several checkouts can serve simultaneously. See scripts/devports.rb.

[tasks.dev]
description = "Start this checkout's long-running services (PostgreSQL oracle) under process-compose"
run = "ruby scripts/dev.rb"

[tasks."db:init"]
description = "Create this checkout's PostgreSQL cluster under .dev/postgres (idempotent)"
run = "bundle exec rake db:init"

[tasks."db:psql"]
description = "psql against this checkout's cluster"
run = "bundle exec rake db:psql"

[tasks."dev:ports"]
description = "Print this worktree's TCP port allocation"
run = "bundle exec rake dev:ports:show"

[tasks."dev:ports:ensure"]
description = "Allocate this worktree's port block, re-allocating on collision"
run = "bundle exec rake dev:ports:ensure"
