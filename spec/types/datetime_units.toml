# Datetime unit-name tables — CANONICAL DATA (CLAUDE.md §5).
#
# PostgreSQL 18's two datetime keyword tables, copied entry for entry from
# src/backend/utils/adt/datetime.c: `deltatktbl` (searched by `DecodeUnits`) and `datetktbl`
# (searched by `DecodeSpecial`). They are the vocabulary of the unit name that
# `EXTRACT(field FROM …)`, `date_part(text, …)`, and `date_trunc(text, …)` take, including
# PostgreSQL's aliases (`hours`, `msec`, `y`, `mon`, `jd`, …). Reasoning:
# ../design/timezones.md §9.6 — read it before editing this file.
#
# Build-time input to per-language codegen (scripts/gen_datetime_units.rb → the per-core
# `DELTA_TOKENS` / `DATE_TOKENS` tables); never parsed at runtime. Only the tables are shared
# data: the lookup (case-fold, truncate, search) and what each function does with the result
# are hand-written per core.
#
# --- conventions -------------------------------------------------------------
# token_max_len  PostgreSQL's TOKMAXLEN. A lookup compares at most this many bytes of the
#                (ASCII-lowercased) name, so a name longer than a 10-byte token still matches
#                it: `microseconds` and `microsecondsXYZ` are `microsecon`, `timezone_hour` is
#                `timezone_h`. A token shorter than this must match the whole name.
# token          the table key, lowercase ASCII, at most token_max_len bytes. Each table is
#                in strictly ascending byte order (PostgreSQL binary-searches it); the
#                generator checks this.
# type           PostgreSQL's token type, lowercased: `units` (a unit), `reserv` (a reserved
#                word), or another type (`ago`, `ignore_dtf`, `month`, `dow`, `ampm`, `adbc`,
#                `isotime`, `dtzmod`) that no unit lookup accepts.
# value          for `units`, the canonical jed unit the token names (the names the kernels
#                match on: `microseconds`, `milliseconds`, `second`, `minute`, `hour`, `day`,
#                `week`, `month`, `quarter`, `year`, `decade`, `century`, `millennium`,
#                `timezone`, `timezone_hour`, `timezone_minute`, `julian`, `dow`, `doy`,
#                `isodow`, `isoyear`); for `reserv`, the reserved meaning (`epoch` is the one
#                EXTRACT field; `late`, `early`, `now`, `today`, `tomorrow`, `yesterday`, `zulu`
#                are not fields). Omitted for the other types, whose PostgreSQL values (month
#                and weekday numbers, …) no unit lookup reads.
#
# The lookups (timezones.md §9.6):
#   date_trunc            delta only: a `units` entry is the unit; anything else is unrecognized.
#   EXTRACT / date_part   delta first; on a miss, date. A `units` entry is the unit; `reserv`
#                         `epoch` is the `epoch` field; any other `reserv` word is unsupported
#                         (0A000) for a date/timestamp/timestamptz and unrecognized (22023) for an
#                         interval. A non-`units` delta entry (`@`, `ago`) stops the search
#                         unrecognized, as in PostgreSQL.
# Shadowing is PostgreSQL's: `m` is `minute` (delta) though datetktbl reads it as month; `mm` (date
# only) is `minute`, so `EXTRACT(mm …)` is the minute while `date_trunc('mm', …)` is unrecognized.
# -----------------------------------------------------------------------------

schema_version = 1
token_max_len = 10

# PostgreSQL's deltatktbl.
delta = [
  { token = "@", type = "ignore_dtf" },
  { token = "ago", type = "ago" },
  { token = "c", type = "units", value = "century" },
  { token = "cent", type = "units", value = "century" },
  { token = "centuries", type = "units", value = "century" },
