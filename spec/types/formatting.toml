[words]
months_full = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
months_abbrev = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
days_full = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
days_abbrev = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
# Roman-numeral months, December first: to_timestamp's RM reader tries them in this order so
# that "VIII" wins over "V".
rm_months_upper = ["XII", "XI", "X", "IX", "VIII", "VII", "VI", "V", "IV", "III", "II", "I"]
rm_months_lower = ["xii", "xi", "x", "ix", "viii", "vii", "vi", "v", "iv", "iii", "ii", "i"]
# Roman-numeral digits for to_char's RN: units, tens, hundreds (1..9 each).
rn_units = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX"]
rn_tens = ["X", "XX", "XXX", "XL", "L", "LX", "LXX", "LXXX", "XC"]
rn_hundreds = ["C", "CC", "CCC", "CD", "D", "DC", "DCC", "DCCC", "CM"]
# to_timestamp's AM/PM and AD/BC readers: an even index is AM (AD), an odd one PM (BC).
ampm = ["am", "pm", "AM", "PM"]
ampm_long = ["a.m.", "p.m.", "A.M.", "P.M."]
adbc = ["ad", "bc", "AD", "BC"]
adbc_long = ["a.d.", "b.c.", "A.D.", "B.C."]
# Ordinal suffixes for 1, 2, 3, and everything else.
ordinal_upper = ["ST", "ND", "RD", "TH"]
ordinal_lower = ["st", "nd", "rd", "th"]
