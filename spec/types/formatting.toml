# Data-type formatting tables — CANONICAL DATA (CLAUDE.md §5).
#
# PostgreSQL 18's template vocabulary for to_char / to_timestamp / to_date / to_number, copied
# entry for entry from src/backend/utils/adt/formatting.c (DCH_keywords, DCH_suff, NUM_keywords)
# and the word lists it and datetime.c consult. Reasoning: ../design/formatting.md — read it
# before editing this file.
#
# Build-time input to per-language codegen (scripts/gen_formatting.rb → the per-core
# `formatting_gen` tables); never parsed at runtime. Only the tables are shared data: the template
# parser, the to_char / from-char processors, and the number processor are hand-written per core.
#
# --- conventions -------------------------------------------------------------
# dch / num   The keyword tables, in PostgreSQL's order. ORDER IS LOAD-BEARING: a template is
#             matched by a sequential search that starts at the first keyword sharing the
#             template character's first byte and stops at the first keyword whose name is a
#             prefix of the remaining template (so "HH24" must precede "HH", "DDD" precede "DD").
#             Entries with the same first byte are contiguous; the generator checks this.
# name        the pattern as written (case-sensitive, ASCII).
# id          the action the pattern performs. Several names share an id ("cc" is "CC",
#             "SSSSS" is "SSSS", "ddd" is "DDD") because they behave identically; the
#             case-variant names that render differently ("Day"/"DAY"/"day") have their own id.
# is_digit    (dch) the field reads/writes digits — the "next node is a separator" test of
#             to_timestamp's fixed-width integer reader (formatting.c is_next_separator).
# date_mode   (dch) the date convention the pattern belongs to: "gregorian", "isoweek", or
#             "none". Mixing gregorian and isoweek in one to_timestamp template is 22007.
# suffixes    the datetime modifiers. "prefix" ones (FM, TM) are matched before a keyword,
#             "postfix" ones (TH, th, SP) after it; id names the flag.
# words       the fixed English word lists (no locale: TM renders these same words).
# -----------------------------------------------------------------------------

schema_version = 1

# PostgreSQL's DCH_suff.
suffixes = [
  { name = "FM", id = "FM", type = "prefix" },
  { name = "fm", id = "FM", type = "prefix" },
  { name = "TM", id = "TM", type = "prefix" },
  { name = "tm", id = "TM", type = "prefix" },
  { name = "TH", id = "TH", type = "postfix" },
  { name = "th", id = "th", type = "postfix" },
  { name = "SP", id = "SP", type = "postfix" },
]

