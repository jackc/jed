# Page-service byte fixtures — CANONICAL DATA (CLAUDE.md §8).
#
# Every core's hand-written codec must, for each [[frame]]:
#   1. encode   the message from its fields and produce exactly `hex`;
#   2. decode   `hex` (with the given page_size) back to the same message and fields;
# for each [[owner_record]], encode and decode the same way; and for each [[malformed]], reject
# `hex` as a protocol violation (08P01) when decoding it as one complete frame. `kind` is the fault
# the Ruby reference detects; a core need only reject.
#
# Field values are strings in a canonical text form, keyed `f_<field name>` (README.md §1 types):
#   u8/u16/u32/u64   decimal
#   bool             "true" / "false"
#   id16             32 lowercase hex digits
#   sqlstate/string  the text itself
#   page             "<prefix hex>/<fill hex>": the prefix bytes, then the fill byte up to page_size
#   u32_list         comma-separated decimals; "" is the empty list
#   page_list        pages separated by ";"; "" is the empty list
#   indexed_page_list  "<index>=<page>" items separated by ";"; "" is the empty list
#   credential       "" (none), "passphrase:<text>", or "key:<64 lowercase hex digits>"
# page_size is "0" when the message has no page field. Bytes are lowercase hex, no separators.
# Regenerate the hex with `ruby spec/pageservice/verify.rb --generate` only when the contract changes.

schema_version = 1

