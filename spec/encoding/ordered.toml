# Ordered index slot vectors (../design/encoding.md §2.16, indexes.md §11): every keyable type's bare
# order-preserving body (§2.1-§2.15) in the four ordered slots — ASC NULLS LAST (the §2.2 slot: 00 present,
# 01 NULL), ASC NULLS FIRST (01 present, 00 NULL), DESC NULLS FIRST (FF present + the bitwise-inverted
# body, FE NULL — the §2.3 inversion), DESC NULLS LAST (FE present + inverted body, FF NULL). Within a
# group the cases are in ASCENDING logical order with the one NULL case last; verify.rb walks each order's
# logical sequence (values reversed for DESC, NULL first or last) and checks the bytes are strictly
# increasing AND prefix-free (so a slot composes with the following slots + storage-key suffix). The
# collated group's bodies are the dev-root UCA sort keys pinned in ../collation/vectors/sortkey.toml.
# Generated by the encoders in verify.rb; checked by `mise run verify`.

