# GIN posting-run vectors (../design/gin.md §4.5, format_version 43). A GIN entry tree record is a
# RUN of one term's posting list:
#
#   run  = term ‖ last ‖ body ‖ u16 BE len(body)
#   body = for each storage key but the last, ascending: varint(shared) ‖ varint(len − shared) ‖
#          key[shared..], against the previous key (the first against `last`); varint = LEB128
#
# A run grows only to GIN_RUN_MAX_BYTES = 64 bytes (a run of one key may be longer).
# `[[run]]`: a term + ascending storage keys → the run bytes (decoding them gives the keys back).
# `[[pack]]`: a from-scratch build's greedy packing of a term's ascending keys → its runs.
# `[[history]]`: insert (`+key`) / remove (`-key`) operations on one term's posting runs, applied in
# order from an empty index → the resulting runs, ascending. Insert: the first run whose last key is
# ≥ the key takes it, split into its first ⌈n/2⌉ keys and the rest (recursively) when it outgrows
# the limit; a key above every run joins the last run when that stays within the limit, else
# starts a new run. Remove: the run holding the key loses it (an empty run disappears; an
# over-limit run splits the same way). Hex strings throughout. Verified by verify.rb against an
# independent Ruby reference; each core checks its own codec and maintenance against this file.

schema_version = 1

# one key
[[run]]
term = "80000007"
keys = ["80000001"]
run = "80000007800000010000"

# two keys sharing a prefix
[[run]]
term = "80000007"
keys = ["80000001", "80000002"]
run = "80000007800000020301010003"

# a long shared run
[[run]]
term = "80000007"
keys = ["80000003", "80000006", "80000009", "8000000c", "8000000f", "80000012", "80000015", "80000018"]
run = "800000078000001803010303010603010903010c03010f0301120301150015"

# varying lengths (text storage keys)
[[run]]
term = "016e0001"
keys = ["610001", "61620001", "6162630001", "620001"]
run = "016e0001620001000361000101036200010203630001000f"

