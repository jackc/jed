# GIN `jsonb_ops` term vectors (../design/gin.md §2.1/§4.1). Not a key encoding of a value but the
# inverted index's TERM bytes, built from the text (encoding.md §2.4) and decimal (§2.5) key rules:
#
#   term = flag ‖ body
#   flag = 0x01 key │ 0x02 null │ 0x03 boolean │ 0x04 number │ 0x05 string value
#          (│ 0x10 when a key / number / string body source was cut to its first 128 bytes)
#   body = null: empty; boolean: 0x00 / 0x01;
#          key / string: text-terminated-escape over the (cut) UTF-8 bytes;
#          number: text-terminated-escape over the (cut) decimal-order-preserving key.
#
# `[[index]]`: a document (JSON text, as `jsonb` input) and its index term SET — deduplicated, in
# ascending byte order. Every object key and every string array element (incl. a top-level string)
# is a KEY term; every other scalar a value term. `[[key]]`: the query term of a `?` / `?|` / `?&`
# key. Verified by verify.rb against an independent Ruby reference; each core checks its own term
# extraction against this file.

schema_version = 1

# keys at every level; an array string element is a KEY term, a member string value a STRING term
[[index]]
doc = '{"a": 1, "b": [true, null, "x"], "c": {"d": "e"}}'
terms = [
  "01610001",
  "01620001",
  "01630001",
  "01640001",
  "01780001",
  "02",
  "0301",
  "04058000ff00ff010200ff0001",
  "05650001",
]

# a top-level array: 1.5 and 1.50 are one number term; nested containers recurse
[[index]]
doc = '["x", 1.5, 1.50, false, {"a": 2}, ["y"]]'
terms = [
  "01610001",
  "01780001",
  "01790001",
  "0300",
  "04058000ff00ff01023300ff0001",
  "04058000ff00ff010300ff0001",
]

# a top-level string is a one-element raw-scalar array: a KEY term
[[index]]
doc = '"x"'
terms = [
  "01780001",
]

# a top-level number
[[index]]
doc = '42'
terms = [
  "04058000ff00ff012b00ff0001",
]

# a top-level JSON null: the null value term
[[index]]
doc = 'null'
terms = [
  "02",
]

# a top-level boolean
[[index]]
doc = 'true'
terms = [
  "0301",
]

# an empty object: no terms
[[index]]
doc = '{}'
terms = [
]

# an empty array: no terms
[[index]]
doc = '[]'
terms = [
]

# only empty containers: no terms
[[index]]
doc = '[[], {}, [[]]]'
terms = [
]

# the same text as a key and as a string value: two distinct terms
[[index]]
doc = '{"a": "a"}'
terms = [
  "01610001",
  "05610001",
]

# duplicates collapse: one key term a, one number term 1
[[index]]
doc = '{"a": {"a": {"a": 1}}, "b": [1, 1.0, 1.00]}'
terms = [
  "01610001",
  "01620001",
  "04058000ff00ff010200ff0001",
]

