# PostgreSQL's quoted keywords — CANONICAL DATA (CLAUDE.md §5).
#
# Every PostgreSQL 18 keyword that is NOT an unreserved keyword, copied entry for entry from
# src/include/parser/kwlist.h: the RESERVED_KEYWORD, COL_NAME_KEYWORD, and TYPE_FUNC_NAME_KEYWORD
# rows (the 330 UNRESERVED_KEYWORD rows are left out). PostgreSQL's quote_identifier (ruleutils.c)
# double-quotes an otherwise-safe identifier that is one of these words, so quote_ident('select') is
# '"select"' and format('%I', 'table') is '"table"', while an unreserved keyword such as
# quote_ident('abort') stays bare. Reasoning: ../design/string-functions.md §3 (quote_ident) — read it
# before editing this file.
#
# jed itself reserves no keywords (../design/grammar.md §3). This list exists only so the SQL
# functions that build identifier text produce PostgreSQL's output byte for byte; it does not affect
# what jed's parser accepts.
#
# Build-time input to per-language codegen (scripts/gen_keywords.rb → the per-core
# `QUOTED_KEYWORDS` table); never parsed at runtime. The lookup that reads it is hand-written per
# core.
#
# --- conventions -------------------------------------------------------------
# word      the keyword: lowercase ASCII letters and `_`. The list is in strictly ascending byte
#           order, as kwlist.h is; the generator checks this.
# category  PostgreSQL's keyword category: `reserved`, `col_name`, or `type_func_name`. All three are
#           quoted alike; the category is kept for fidelity to kwlist.h.

source = "postgres REL_18_STABLE src/include/parser/kwlist.h"

