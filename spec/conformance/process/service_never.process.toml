schema_version = 1
name = "service-ownership-never"
description = "Page service phase 4: an opener with ownership = never fails 55006 when no process owns the database, and as a client it never promotes: when its owner dies it fails 08006 once its open timeout passes."
requires = ["file.page_service"]

[[step]]
actor = "a"
command = "start"
argument = "create-service"

[[step]]
actor = "a"
command = "exec"
sql = "CREATE TABLE t (id i64 PRIMARY KEY)"

[[step]]
actor = "a"
command = "close"

[[step]]
actor = "b"
command = "start"
argument = "open-service 300 60000 ownership=never"
expect_error = "55006"

[[step]]
actor = "a"
command = "start"
argument = "open-service"

[[step]]
actor = "b"
command = "start"
argument = "open-service 300 60000 ownership=never"

[[step]]
actor = "b"
command = "role"
expect = "client"

[[step]]
actor = "a"
command = "kill"

[[step]]
actor = "b"
command = "query_i64"
sql = "SELECT count(*) FROM t"
expect_error = "08006"

[[step]]
actor = "b"
command = "role"
expect = "client"

[[step]]
actor = "b"
command = "close"
