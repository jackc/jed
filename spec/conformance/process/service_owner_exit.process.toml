schema_version = 1
name = "service-owner-exit-and-reelection"
description = "Page service phase 2: a client whose owner dies fails with 08006 (no promotion until phase 4); presence is released by process death, so the next opener is elected owner."
requires = ["file.page_service"]

[[step]]
actor = "a"
command = "start"
argument = "create-service"

[[step]]
actor = "a"
command = "exec"
sql = "CREATE TABLE t (id i64 PRIMARY KEY)"

[[step]]
actor = "a"
command = "exec"
sql = "INSERT INTO t VALUES (1), (2), (3)"

[[step]]
actor = "b"
command = "start"
argument = "open-service"

[[step]]
actor = "b"
command = "query_i64"
sql = "SELECT id FROM t ORDER BY id"
expect = "1,2,3"

[[step]]
actor = "a"
command = "kill"

[[step]]
actor = "b"
command = "query_i64"
sql = "SELECT id FROM t ORDER BY id"
expect_error = "08006"

[[step]]
actor = "b"
command = "close"

# The killed owner's presence lock died with it: the next opener is the owner and can write.
[[step]]
actor = "b"
command = "start"
argument = "open-service"

[[step]]
actor = "b"
command = "exec"
sql = "INSERT INTO t VALUES (4)"

# And the first core, opening again, is now a client of it.
[[step]]
actor = "a"
command = "start"
argument = "open-service"

[[step]]
actor = "a"
command = "query_i64"
sql = "SELECT id FROM t ORDER BY id"
expect = "1,2,3,4"

[[step]]
actor = "a"
command = "exec"
sql = "INSERT INTO t VALUES (5)"
expect_error = "25006"

[[step]]
actor = "a"
command = "close"

[[step]]
actor = "b"
command = "close"
