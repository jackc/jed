schema_version = 1
name = "file-attachment-ownership"
description = "A file attachment owns its file as a non-serving owner until attachments join the page service: a second handle's attach fails 55006 while the first holds it, and succeeds once the first closes or dies."
requires = ["file.page_service"]

[[step]]
actor = "b"
command = "start"
argument = "create"
path = "attachment"

[[step]]
actor = "b"
command = "exec"
sql = "CREATE TABLE t (id i64 PRIMARY KEY)"

[[step]]
actor = "b"
command = "exec"
sql = "INSERT INTO t VALUES (1)"

[[step]]
actor = "b"
command = "close"

[[step]]
actor = "a"
command = "start"
argument = "create"
path = "main_a"

[[step]]
actor = "a"
command = "attach"
name = "work"
path = "attachment"

[[step]]
actor = "b"
command = "start"
argument = "create"
path = "main_b"

[[step]]
actor = "b"
command = "attach"
name = "work"
path = "attachment"
expect_error = "55006"

[[step]]
actor = "a"
command = "exec"
sql = "INSERT INTO work.t VALUES (2)"

[[step]]
actor = "a"
command = "close"

[[step]]
actor = "b"
command = "attach"
name = "work"
path = "attachment"

[[step]]
actor = "b"
command = "query_i64"
sql = "SELECT id FROM work.t ORDER BY id"
expect = "1,2"

[[step]]
actor = "b"
command = "write_open"
argument = "0"

[[step]]
actor = "b"
command = "write_exec"
sql = "INSERT INTO work.t VALUES (3)"

[[step]]
actor = "b"
command = "kill"

[[step]]
actor = "a"
command = "start"
argument = "open"
path = "main_a"

[[step]]
actor = "a"
command = "attach"
name = "work"
path = "attachment"

[[step]]
actor = "a"
command = "query_i64"
sql = "SELECT id FROM work.t ORDER BY id"
expect = "1,2"

[[step]]
actor = "a"
command = "close"
