schema_version = 1
name = "service-yield-to-prefer"
description = "Page service phase 4: a tool that owns the database with ownership = yield hands ownership to an application that opens with prefer. The application becomes the owner; the tool becomes its client and keeps working."
requires = ["file.page_service"]

[[step]]
actor = "a"
command = "start"
argument = "create 5000 60000 ownership=yield"

[[step]]
actor = "a"
command = "exec"
sql = "CREATE TABLE t (id i64 PRIMARY KEY)"

[[step]]
actor = "a"
command = "exec"
sql = "INSERT INTO t VALUES (1)"

[[step]]
actor = "a"
command = "role"
expect = "owner"

[[step]]
actor = "b"
command = "start"
argument = "open"

[[step]]
actor = "b"
command = "role"
expect = "owner"
retry_ms = 5000

[[step]]
actor = "a"
command = "role"
expect = "client"
retry_ms = 5000

[[step]]
actor = "a"
command = "exec"
sql = "INSERT INTO t VALUES (2)"

[[step]]
actor = "b"
command = "query_i64"
sql = "SELECT id FROM t ORDER BY id"
expect = "1,2"

[[step]]
actor = "b"
command = "exec"
sql = "INSERT INTO t VALUES (3)"

[[step]]
actor = "a"
command = "query_i64"
sql = "SELECT id FROM t ORDER BY id"
expect = "1,2,3"

[[step]]
actor = "a"
command = "close"

[[step]]
actor = "b"
command = "close"
