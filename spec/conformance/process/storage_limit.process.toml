schema_version = 1
name = "storage-limit-live-pages"
description = "A file's max_storage_bytes trips at the same live-page count whether one process writes it alone or two co-resident processes share it with append-only commits; a peer's delete lowers the count every process sees (memory.md §8.7)."
requires = ["file.shared_process"]

# One process alone: twenty pages hold fourteen batches.

[[step]]
actor = "a"
command = "start"
argument = "create"
path = "solo"

[[step]]
actor = "a"
command = "exec"
sql = "CREATE TABLE t (id i32 PRIMARY KEY, v text)"

[[step]]
actor = "a"
command = "max_storage_bytes"
argument = "163840"

