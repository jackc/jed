schema_version = 1
name = "service-commit-resolution-by-promotion"
description = "Page service phase 4: the owner exits after a client commit is durable but before acknowledging it (a test hook). The client, the only other process, resolves its commit by promoting itself: its resolution window, seeded from the recovered meta slots, says the commit succeeded."
requires = ["file.page_service"]

[[step]]
actor = "a"
command = "start"
argument = "create-service"

[[step]]
actor = "a"
command = "exec"
sql = "CREATE TABLE t (id i64 PRIMARY KEY)"

[[step]]
actor = "b"
command = "start"
argument = "open-service"

[[step]]
actor = "b"
command = "exec"
sql = "INSERT INTO t VALUES (1)"

[[step]]
actor = "a"
command = "crash_next_ack"

[[step]]
actor = "b"
command = "exec"
sql = "INSERT INTO t VALUES (2)"

[[step]]
actor = "b"
command = "role"
expect = "owner"

[[step]]
actor = "b"
command = "query_i64"
sql = "SELECT id FROM t ORDER BY id"
expect = "1,2"

[[step]]
actor = "b"
command = "exec"
sql = "INSERT INTO t VALUES (3)"

[[step]]
actor = "b"
command = "close"

[[step]]
actor = "b"
command = "start"
argument = "open-service"

[[step]]
actor = "b"
command = "query_i64"
sql = "SELECT id FROM t ORDER BY id"
expect = "1,2,3"

[[step]]
actor = "b"
command = "close"
