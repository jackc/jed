# SIMILAR TO vectors — (pattern[, escape], input) -> the translation, the SIMILAR TO result, the
# SIMILAR substring, and the regex_compile / regex_step cost of each (../design/regex.md §8f, README.md).
# Each core translates the pattern (similar_to_escape), compiles it dot-all and matches the input
# (`similar`, `similar_compile` instructions, `similar_steps`), then builds the substring matcher and
# runs it (`substring`, or `substring_null = true` for no match; `substring_compile` instructions
# summed over its programs, `substring_steps` summed over its runs).
#
# `escape` absent is the default backslash; `escape = ""` is no escape character. `error` is the
# translation's SQLSTATE (nothing else is checked); `substring_error` the substring matcher's compile
# error (a part that is not a pattern by itself). Generated from the first conformant core and
# audited against the VM spec; like the on-disk goldens it is then the pinned contract.

schema_version = 1

[[case]]
pattern = "abc"
input = "abc"
translation = "^(?:abc)$"
similar = true
similar_compile = 11
similar_steps = 25
substring = "abc"
substring_compile = 11
substring_steps = 25

